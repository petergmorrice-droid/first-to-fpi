<title>UAT Tower</title>

<style>
/* Layout: stretch caption on top, one 16:9 race stage, thumb controls beneath on touch screens. Single committed look: clinical-candy, dark frame. */
:root{
  --ink:#17203A; --ink2:#232F52; --paper:#F4F8F5; --teal:#12A594; --teal-d:#0B6E66;
  --signal:#FF5436; --signal-d:#C93A20; --gold:#FFC83D; --violet:#6B4EFF; --violet-d:#4A31D1; --mint:#CFF1E7; --mute:#9FB0D0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{background:var(--ink);color:var(--paper);font-family:var(--body);padding-inline:16px;padding-block:12px 20px;-webkit-tap-highlight-color:transparent}
#app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#CFF1E7;box-shadow:0 0 0 4px var(--ink2),0 12px 0 -2px #0E1630}
#c{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(23,32,58,.6)}
#ov.clear{background:transparent;pointer-events:none}
#cap[hidden]{display:none}
#cap[hidden]{display:none}
#cap{background:var(--ink2);color:#fff;border-left:6px solid var(--gold);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;min-height:clamp(96px,22vw,100px);justify-content:center}
#cap b{font-family:var(--display);font-weight:800;font-size:clamp(16px,4vw,22px);line-height:1.05}
#cap span{font-size:clamp(12px,3vw,15px);line-height:1.35}
#cap span strong{color:var(--gold);font-weight:700}
#cap em{font-style:normal;font-size:clamp(11px,2.7vw,13px);line-height:1.3;color:#BFD0F2}
#skip{position:absolute;right:10px;top:10px}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:clamp(12px,3vw,24px);width:min(96%,580px);max-height:100%;overflow:auto;box-shadow:0 6px 0 var(--teal-d);display:flex;flex-direction:column;gap:clamp(6px,1.5vw,11px)}
.card h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,54px);line-height:.95;margin:0;letter-spacing:-.5px;text-wrap:balance}
.card h2{font-family:var(--display);font-weight:800;font-size:clamp(21px,5vw,32px);line-height:1;margin:0;text-wrap:balance}
.card h3{font-family:var(--display);font-weight:800;font-size:clamp(14px,3.4vw,18px);margin:4px 0 0}
.card p{margin:0;font-size:clamp(12px,2.9vw,15px);line-height:1.4;max-width:62ch}
.kick{font-weight:700;font-size:clamp(11px,2.6vw,14px);color:var(--teal-d)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.legend li{display:flex;gap:8px;align-items:flex-start;font-size:clamp(11px,2.7vw,14px);line-height:1.3;min-width:0}
.legend i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:2px}
.btn{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.2vw,24px);color:#fff;background:var(--teal);border:0;border-bottom:6px solid var(--teal-d);border-radius:16px;padding:8px 20px 4px;cursor:pointer}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.btn:focus-visible,.pb:focus-visible,.card input:focus-visible,#mute:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.alt{background:var(--violet);border-bottom-color:var(--violet-d)}
.btn.ghost{background:#DDE6E1;color:var(--ink);border-bottom-color:#B8C7BF}
.btn.sm{font-size:clamp(14px,3.4vw,18px);padding:5px 14px 2px;border-bottom-width:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:clamp(11px,2.7vw,14px);flex:1;min-width:130px}
.card input{font:inherit;font-weight:600;font-size:16px;padding:7px 10px;border-radius:10px;border:2px solid #B8C7BF;background:#fff;color:var(--ink);min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:clamp(11px,2.8vw,14px);font-variant-numeric:tabular-nums}
.tbl td,.tbl th{color:var(--ink);padding:3px 6px;border-bottom:1px solid #D5E3DC;text-align:left;vertical-align:top}
.tbl th{font-weight:700;color:#51617F;font-size:.9em}
.tbl td:last-child.r,.tbl td.r{text-align:right;font-weight:700;white-space:nowrap}

.big{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,46px);line-height:1}

.plist i{width:16px;height:16px;border-radius:50%;flex:none}

#pad .grp{display:flex;gap:12px}
.pb{font-family:var(--display);font-weight:800;color:#fff;border:0;border-bottom:7px solid rgba(0,0,0,.28);border-radius:22px;background:var(--violet);width:76px;height:68px;font-size:30px;touch-action:none;user-select:none;-webkit-user-select:none}
.pb.jump{width:min(42vw,200px);background:var(--teal);font-size:26px}
.pb.on{transform:translateY(4px);border-bottom-width:3px}
#hint{font-size:14px;color:#C9D6F0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
#hint .keys{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
#hint .kg{display:flex;align-items:center;gap:6px;font-weight:700;color:#fff}
#hint .kg i{font-style:normal;font-weight:600;color:#9FB0D6;font-size:12px;margin:0 2px}
#hint .kc{display:inline-block;min-width:30px;padding:5px 9px;border-radius:8px;background:#F1F5FC;color:#17203A;font-weight:800;font-size:13px;text-align:center;box-shadow:0 3px 0 #8C9BBE}
#hint .kh{font-weight:800;color:var(--gold);font-size:14px}
#hint .kc{font-size:15px;padding:7px 11px;min-width:36px}
#hint .kn{font-size:12px;color:#9FB0D6;font-weight:600}
#hint .hbtns{display:flex;gap:10px}
#hint button{background:rgba(255,255,255,.08);border:2px solid #5A6C99;border-radius:999px;color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:6px 14px}
#hint button:hover{background:rgba(255,255,255,.18)}
#exitg{color:#FFB4A8;border-color:#C9665A}
@media (pointer:coarse){#pad{display:flex}#hint .keys{display:none}}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
#lobbybar{background:var(--ink2);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}

#board{background:var(--ink2);border-radius:14px;padding:8px 10px 10px}
#board[hidden]{display:none}
#board .bd-h{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
#bdIn{position:relative}
.bd-row{position:absolute;left:0;top:0;height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.07);color:#fff;font-weight:700;font-size:14px;transition:transform .45s cubic-bezier(.3,.8,.3,1),background .4s;box-sizing:border-box;overflow:hidden}
.bd-row .bn{width:24px;text-align:center;font-weight:900;color:var(--gold)}
.bd-row i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.bd-row .bnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row .bpc{font-size:12px;color:var(--mute);font-weight:700}
.bd-row.me{background:rgba(255,216,77,.22);box-shadow:inset 0 0 0 2px var(--gold)}
.bd-row.up{background:rgba(111,227,168,.35)}.bd-row.dn{background:rgba(255,100,80,.28)}
.bd-row.fin .bpc{color:#6FE3A8}
#lobbybar[hidden],#roombar[hidden],#emobar[hidden]{display:none}
#roombar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink2);border:2px solid #4A5A88;border-radius:14px;padding:8px 14px}
#roombar .rc{display:flex;align-items:baseline;gap:10px}#roombar .rc-l{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}#roombar .rc-c{font-size:clamp(22px,4vw,30px);font-weight:900;color:var(--gold);letter-spacing:.04em;line-height:1}#roombar .rc-b{display:flex;gap:8px;flex-wrap:wrap}
#emobar{margin-top:0}#emobar .lb-row.em{gap:10px;flex-wrap:nowrap}
#emobar .chip.big,#lobbybar .chip.big{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;font:inherit;font-weight:700;font-size:clamp(16px,2.6vw,20px);padding:5px 8px;border-radius:14px;border:3px solid #6C7BA8;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;box-shadow:0 3px 0 #3A4A78}
#emobar .chip.big:hover{background:rgba(255,255,255,.2)}#emobar .chip.big .ee{font-size:1.5em;line-height:1}#emobar .chip.big .ek{position:absolute;top:5px;left:8px;font-size:11px;min-width:18px;padding:1px 5px;border-radius:5px;background:#F1F5FC;color:#17203A;text-align:center}#emobar .chip.big[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);box-shadow:0 4px 0 #B8860B}
.lb-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lb-l{width:62px;font-weight:700;font-size:13px;color:var(--mute)}
.lb-row.opts{max-height:84px;overflow:auto}
#lobbybar .chip.tab{border-color:#6C7BA8}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 2px}
.pod{display:flex;flex-direction:column;align-items:center;width:30%;max-width:130px;font-size:clamp(11px,2.8vw,14px);text-align:center}
.pod b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{color:var(--mute);font-variant-numeric:tabular-nums}
.pod img{width:min(80px,20vw);height:auto}
.pod .blk{width:100%;border-radius:8px 8px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)}
#howto{border-radius:16px;overflow:hidden;width:272px}
#howto[hidden]{display:none}
#ht{display:block;width:272px;height:140px}
.card.dress{width:min(96%,640px)}
.dr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
#dv{width:min(220px,40vw);height:auto;border-radius:16px;background:#CFF1E7;flex:none}
.dcol{display:flex;flex-direction:column;gap:5px;flex:1;min-width:240px}
.dcol h3{margin:2px 0 0;font-size:14px;color:var(--teal-d)}
.ar{display:flex;align-items:center;gap:6px}
.al{width:64px;font-weight:700;font-size:13px}
.av{flex:1;text-align:center;font-size:14px;background:#E6EEEA;border-radius:10px;padding:5px 6px;min-width:90px}
.arw{width:38px;height:34px;border:0;border-bottom:4px solid var(--violet-d);border-radius:10px;background:var(--violet);color:#fff;font-size:15px;cursor:pointer}
.arw:active{transform:translateY(2px);border-bottom-width:2px}
.arw:focus-visible,.card .swb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app.lobby{max-width:1480px;display:grid;grid-template-columns:208px minmax(0,1fr) 224px;column-gap:14px;row-gap:10px;align-items:start}
#app.lobby>#roombar,#app.lobby>#stage,#app.lobby>#emobar,#app.lobby>#hint{grid-column:2}
#app.lobby>#roombar{grid-row:1}#app.lobby>#stage{grid-row:2}#app.lobby>#emobar{grid-row:3}#app.lobby>#hint{grid-row:4}
#app.lobby>#lobbybar{grid-column:1;grid-row:2/span 3}
#app.lobby>#dress{grid-column:3;grid-row:1/span 4}
#app.lobby>#cap,#app.lobby>#pad{grid-column:1/-1}
#dress{background:var(--paper);color:var(--ink);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:13px;box-shadow:0 5px 0 var(--teal-d)}
#dress[hidden]{display:none}
#dress h2{font-family:var(--display);font-weight:800;font-size:16px;line-height:1;margin:0}
#dress h3{font-family:var(--display);font-weight:800;margin:2px 0 0}
#dress .dr{flex-direction:column;align-items:stretch}
#dress #dv{width:100%;max-width:120px;align-self:center}
#dress .al{width:48px;font-size:12px}#dress .av{font-size:12px;min-width:0;padding:3px 4px}#dress .arw{width:28px;height:26px;font-size:12px}#dress .swb{width:20px;height:20px}#dress .sw{gap:4px}#dress .btn.sm{padding:6px 12px;font-size:13px}
#dress .dcol{min-width:0}
@media (max-width:900px){#app.lobby{display:flex}}
.lb-n{font-size:12px;color:var(--mute);margin-left:4px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swb{width:28px;height:28px;border-radius:50%;border:3px solid #fff3;cursor:pointer;padding:0}
.swb[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
#lobbybar .chip{font:inherit;font-weight:700;font-size:13px;border:2px solid #4A5A88;background:transparent;color:#fff;border-radius:999px;padding:3px 11px;cursor:pointer}
#lobbybar .chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
#lobbybar .lb-row.em{gap:10px;flex-wrap:nowrap}
#lobbybar .chip.big{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;font-size:clamp(16px,2.6vw,20px);padding:14px 8px;border-radius:16px;border:3px solid #6C7BA8;background:rgba(255,255,255,.08);box-shadow:0 4px 0 #3A4770}
#lobbybar .chip.big:hover{background:rgba(255,255,255,.2)}
#lobbybar .chip.big .ee{font-size:1.5em;line-height:1}
#lobbybar .chip.big .ek{position:absolute;top:5px;left:8px;font-size:11px;min-width:18px;padding:1px 5px;border-radius:5px;background:#F1F5FC;color:#17203A;text-align:center}
#lobbybar .chip.big[aria-pressed=true]{box-shadow:0 4px 0 #B8860B}
#lobbybar .lb-room{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.07);border:2px solid #4A5A88;border-radius:14px;padding:10px 14px}
#lobbybar .rc{display:flex;flex-direction:column;gap:2px}
#lobbybar .rc-l{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#lobbybar .rc-c{font-size:clamp(26px,5vw,38px);font-weight:900;color:var(--gold);letter-spacing:.04em;word-break:break-all;line-height:1.05}
#lobbybar .rc-b{display:flex;gap:8px;flex-wrap:wrap}
#lobbybar .roster-h{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
#lobbybar .roster{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
#lobbybar .rs{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:7px 10px;font-weight:700;font-size:15px;color:#fff}
#lobbybar .rs i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;flex:none}
#lobbybar .rs .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lobbybar .rs .rh{font-size:12px;color:var(--gold)}
#lobbybar .rs .rr{font-size:13px;color:var(--mute)}
#lobbybar .rs.on .rr{color:#6FE3A8}
#lobbybar button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

#lobbybar .chip.st{cursor:default}
#lobbybar .rs .rr{font-size:12px}
#hint .kfix{font-weight:800;color:#0E1630;background:var(--gold);border-radius:999px;padding:4px 12px;font-size:13px}
.tbl.rk td:first-child{width:34px;font-weight:900;color:var(--teal-d)}
.card.res{width:min(96%,600px)}
.hero{font-family:var(--display);font-weight:800;font-size:clamp(22px,4.4vw,34px);line-height:1;text-align:center;margin:0}
.sub{margin:0;text-align:center;color:#51617F;font-size:clamp(12px,2.4vw,14px)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.how li{font-size:clamp(11px,2.4vw,14px);line-height:1.3;display:flex;gap:7px;align-items:flex-start}
.how i{flex:none;width:18px;height:18px;border-radius:6px;background:var(--teal);color:#fff;font:800 11px/18px var(--display);text-align:center;font-style:normal}
a.alink{color:var(--violet-d);font-weight:700}
</style>
<main id="app">
  <div id="roombar" hidden></div>
  <div id="stage">
    <canvas id="c" width="960" height="540" aria-label="UAT Tower"></canvas>
    <div id="ov"></div>
  </div>
  <div id="emobar" hidden></div>
  <div id="lobbybar" hidden></div>
  <aside id="dress" hidden></aside>
  <div id="pad">
    <div class="grp"><button class="pb" id="bL" aria-label="Move left">&#9664;</button><button class="pb" id="bR" aria-label="Move right">&#9654;</button></div>
    <button class="pb jump" id="bJ" aria-label="Jump">JUMP</button>
  </div>
  <div id="hint"><span class="keys"><span class="kh">How to move</span><span class="kg">Run <span class="kc">&larr;</span><span class="kc">&rarr;</span><i>or</i><span class="kc">A</span><span class="kc">D</span></span><span class="kg">Jump <span class="kc" style="min-width:70px">Space</span><i>or</i><span class="kc">W</span><span class="kc">&uarr;</span></span><span class="kfix">Fix a finding: stand next to it</span></span><span class="hbtns"><button id="leaveb" type="button" hidden>Leave room</button><button id="exitg" type="button" hidden>Exit game</button><button id="mute" type="button">Sound: on</button></span></div>
  <div id="board" hidden><div class="bd-h">Live leaderboard</div><div id="bdIn"></div></div>
</main>
<script>
'use strict';
const W=960,H=540,DT=1/120;
const cv=document.getElementById('c');let cx=cv.getContext('2d');
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
let AC=null,muted=false;
function beep(f,d,type,v,slide){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const SFX={jump:()=>beep(380,.13,'square',.04,320),coin:()=>{beep(880,.08,'triangle',.07);setTimeout(()=>beep(1320,.12,'triangle',.07),60)},
  hit:()=>beep(160,.3,'sawtooth',.07,-110),good:()=>{beep(520,.1,'triangle',.08);setTimeout(()=>beep(780,.18,'triangle',.08),90)},
  late:()=>beep(220,.28,'square',.06,-80),tick:()=>beep(600,.08,'square',.05),go:()=>beep(900,.4,'square',.07),
  fall:()=>beep(500,.5,'triangle',.06,-420),throw:()=>beep(700,.12,'triangle',.04,-300),win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.08),i*110))}};

/* ---------- particles ---------- */
let parts=[];
function burst(x,y,col,n,sp,up){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(up||0),life:.5+Math.random()*.4,max:.9,col,r:2+Math.random()*3})}}
function stepParts(dt){for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt}parts=parts.filter(p=>p.life>0)}

  const feet0=m.y+m.h;m.y+=m.vy*dt;const feet=m.y+m.h;
  m.onG=false;m.plat=null;
  if(m.vy>=0){
    let best=null;
    const test=p=>{const top=p.top;if(m.x+m.w-4>p.x0&&m.x+4<p.x1&&feet0<=top+2&&feet>=top-0.01){if(!best||top<best.top)best=p}};
    for(const p of PL)test(p);for(const e of ELEV)test(e);

(function(){

  add([150,190,230,270,672,712,752],2);

  for(const t of TILES){const a={x:(t.x0+t.x1)/2,y:t.top,f:t.f,hard:t.f===3,tile:true};ANCH.push(a);ANCH_F[t.f].push(a)}})();
const FWT=[.8,1,1,1.3],TTLF=[12,15,18,21];
function genFinds(seed,n,dur){
  const R=rng(seed|0),out=[],act=Math.min(15,5+Math.round(n*.7)),ttl=16,rate=act/ttl;let t=.6,id=0;
  const used=new Map();
  while(t<dur-2){
    let a=null;
    for(let k=0;k<14&&!a;k++){
      let r=R()*(FWT[0]+FWT[1]+FWT[2]+FWT[3]),f=0;while(f<3&&r>=FWT[f]){r-=FWT[f];f++}
      const L=ANCH_F[f],c=L[R()*L.length|0];
      if(!(used.get(c)>t))a=c}
    if(a){const crit=R()<(a.hard?.45:.06),tl=TTLF[a.f]-(crit?3:0);used.set(a,t+tl+.4);
      out.push({id:id++,t0:t,ttl:tl,x:a.x,y:a.y,f:a.f,crit,pts:crit?3:1,need:crit?1:.5,lab:LABELS[R()*LABELS.length|0]})}
    t+=(1/rate)*(.6+R()*.8)}
  return out}

/* Team rooms outside Claude: a small relay server passes messages between everyone with the same room code. */
function relayJoin(base,code){return new Promise((res,rej)=>{
  const url=base.trim().replace(/^http/i,'ws').replace(/\/+$/,'')+'/'+encodeURIComponent(code);
  const peers=new Map(),hs={},pcb=[];let ws=null,closed=false,opened=false,lastP=null,tries=0,gotFirst=false;
  const fire=()=>{const list=[...peers].map(([peer,presence])=>({peer,presence,sameTab:false}));for(const f of pcb){try{f({peers:list})}catch(e){}}};
  const wsend=o=>{if(ws&&ws.readyState===1){try{ws.send(JSON.stringify(o))}catch(e){}}};
  const rm={
    on(t,f){hs[t]=f},onPeers(f){pcb.push(f);fire()},
    emit(t,d){wsend({t:'ev',topic:t,data:d});return Promise.resolve()},
    presence(o){lastP=o;wsend({t:'pres',d:o});return Promise.resolve()},
    leave(){closed=true;try{ws&&ws.close()}catch(e){}return Promise.resolve()}};
  const to=setTimeout(()=>{if(!opened){closed=true;try{ws&&ws.close()}catch(e){}rej(new Error('timeout'))}},8000);
  const connect=()=>{
    try{ws=new WebSocket(url)}catch(e){clearTimeout(to);rej(e);return}
    ws.onopen=()=>{opened=true;tries=0;netMsg='';clearTimeout(to);if(lastP)wsend({t:'pres',d:lastP});if(!gotFirst){gotFirst=true;res(rm)}else{const e=document.getElementById('err');if(e)e.hidden=true}};
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.t==='pres'){peers.set(m.id,m.d);fire()}
      else if(m.t==='leave'){if(peers.delete(m.id))fire()}
      else if(m.t==='ev'&&hs[m.topic]){try{hs[m.topic]({data:m.data,sameTab:false,peer:m.id})}catch(e){}}};
    ws.onclose=()=>{if(closed)return;peers.clear();fire();if(!opened){clearTimeout(to);rej(new Error('closed'));return}
      if(tries<6){tries++;netMsg='Connection lost. Reconnecting...';showErr('Connection lost. Reconnecting...');setTimeout(connect,1000*tries)}else{netMsg='Connection lost. Leave the room and rejoin, or play solo.';showErr('Connection to the multiplayer server was lost. You can still play solo.')}};
    ws.onerror=()=>{}};
  connect()})}

  try{localStorage.setItem('ecoa-name',nm);localStorage.setItem('ecoa-team',rc)}catch(e){}return rc}
function showErr(m){const e=document.getElementById('err');if(e){e.textContent=m;e.hidden=false}}

async function joinRoom(raw){
  const code=raw.toLowerCase().replace(/[^a-z0-9_.-]+/g,'-').replace(/^[^a-z0-9]+/,'').slice(0,40)||'general';
  const R0=await use('room'),RU=relayUrl();
  if(!R0&&!RU){showErr('Team rooms are not available here. You can still play solo.');return}
  const jb=document.querySelector('[data-a=join]');if(jb){jb.disabled=true;jb.textContent='Connecting...'}
  try{room=R0?await R0.join('tw-'+code):await relayJoin(RU,'tw-'+code)}catch(e){room=null;if(jb){jb.disabled=false;jb.textContent='Join team room'}
    showErr(R0?'Could not join that room. Check the code or play solo.':'Could not reach the multiplayer server. Your network may be blocking it, or the server may be offline. You can still play solo.');return}
  roomCode=code;myJoin=Date.now();wasHost=true;
  room.on('start',m=>{if(!m.sameTab)onStart(m.data)});
  room.on('claim',m=>{if(!m.sameTab)onClaim(m.data)});
  room.on('fixed',m=>{if(!m.sameTab)onFixed(m.data)});
  room.on('sync',m=>{if(!m.sameTab)onSync(m.data)});
  room.on('end',m=>{if(!m.sameTab)onEnd(m.data)});
  room.onPeers(onPeers);
  showLobby();sendPres(true)}
function startSolo(){room=null;roomCode='';myJoin=Date.now();ghostMap.clear();state.peers=[];showLobby()}
async function leaveRoom(){lookRand=false;netMsg='';R=null;me=null;try{if(room)await room.leave()}catch(e){}room=null;ghostMap.clear();state.peers=[];state.toast=null;showTitle()}

/* ---------- presence ---------- */
function isHost(){if(!room)return true;for(const g of ghostMap.values())if(g.j&&g.j<myJoin)return false;return true}
function hostDur(){let bj=myJoin,d=durSel;for(const g of ghostMap.values())if(g.j&&g.j<bj){bj=g.j;d=g.rl||d}return d}
function anyInRound(){for(const g of ghostMap.values())if(g.st==='count'||g.st==='play')return true;return false}
const ST_OK=['lobby','count','play','res'];
function onPeers(ch){
  const list=ch.peers.filter(p=>!p.sameTab);state.peers=list;const ids=new Set();
  for(const p of list){const d=p.presence||{};ids.add(p.peer);let g=ghostMap.get(p.peer);
    const hx=isFinite(+d.x)&&d.x!==undefined?clamp(+d.x,0,W):null,hy=isFinite(+d.y)&&d.y!==undefined?clamp(+d.y,0,H):null;
    if(!g){g=Object.assign(mkBody(hx===null?200:hx,hy===null?FY[0]-38:hy),{ghost:true,onG:true});ghostMap.set(p.peer,g)}
    g.name=String(d.n||'Guest').slice(0,16);g.col=/^#[0-9a-fA-F]{6}$/.test(d.c)?d.c:'#8899BB';
    if(hx!==null)g.tx=hx;if(hy!==null)g.ty=hy;if(g.tx===undefined){g.tx=g.x;g.ty=g.y}
    g.face=d.f===-1?-1:1;g.st=ST_OK.includes(d.st)?d.st:'lobby';g.hat=clamp(d.h|0,0,10);g.gl=0;g.eye=clamp(d.e|0,0,4);g.fit=clamp(d.o|0,0,4);g.pat=clamp(d.p|0,0,2);g.shoe=clamp(d.l|0,0,5);
    g.em=(g.st==='lobby'||g.st==='res')?clamp(d.em|0,0,3):0;g.j=+d.j||0;g.rl=clamp(+d.rl||0,0,600)}
  for(const k of [...ghostMap.keys()])if(!ids.has(k))ghostMap.delete(k);
  {const h=isHost();if(h!==wasHost){wasHost=h;if(state.screen==='lobby')buildBar();if(state.screen==='result'&&R)renderResult()}}
  syncRoster()}
function sendPres(force){
  if(!room||!me)return;const sc=state.screen;
  const st=sc==='count'?'count':sc==='play'?'play':sc==='result'?'res':'lobby';
  const o={j:myJoin,n:myName,c:myCol,h:look.h,e:look.y,o:look.o,p:look.p,l:look.l,st,x:Math.round(me.x),y:Math.round(me.y),f:me.face,em:me.em|0,rl:durSel};
  try{room.presence(o).catch(()=>{})}catch(e){}}
function visibleGhosts(){const sc=state.screen,inR=sc==='count'||sc==='play',out=[];
  for(const g of ghostMap.values()){const ok=inR?(g.st==='count'||g.st==='play'):(g.st==='lobby'||g.st==='res');if(ok)out.push(g)}return out}

/* ---------- waiting-room panels ---------- */
function rosterRows(){const rows=[{name:myName||'You',col:myCol,me:true,j:myJoin,st:state.screen==='result'?'res':'lobby'}];
  for(const g of ghostMap.values())rows.push({name:g.name,col:g.col,me:false,j:g.j||9e15,st:g.st});
  const hj=Math.min(...rows.map(r=>r.j||9e15));rows.forEach(r=>r.host=(r.j||9e15)===hj);return rows}
const stText=s=>s==='count'||s==='play'?'playing':s==='res'?'results':'';
function rosterSig(){return rosterRows().map(r=>r.name+r.host+r.col+r.st).join('|')+'|'+hostDur()+'|'+isHost()+anyInRound()}
function rosterHTML(){return rosterRows().map(r=>`<div class="rs"><i style="background:${esc(r.col)}"></i><span class="rn">${esc(r.name)}${r.me?' (you)':''}</span>${r.host?'<span class="rh" title="Room host">&#128081;</span>':''}${stText(r.st)?`<span class="rr">${stText(r.st)}</span>`:''}</div>`).join('')}
function roomTop(){if(!room)return'';return `<div class="rc"><span class="rc-l">Room code</span><b class="rc-c">${esc(roomCode)}</b></div><div class="rc-b"><button class="btn sm alt" data-a="copylink" type="button">Copy invite link</button><button class="btn ghost sm" data-a="copycode" type="button">Copy code</button></div>`}
function rosterPanel(){if(!room)return'';return `<div class="roster-h">Players in the room</div><div id="roster" class="roster">${rosterHTML()}</div>`}
function copyText(s,b,msg){const done=()=>{if(!b)return;const o=b.textContent;b.textContent=msg;setTimeout(()=>{b.textContent=o},1600)};
  try{navigator.clipboard.writeText(s).then(done,()=>fb())}catch(e){fb()}
  function fb(){try{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done()}catch(e){}}}
function buildBar(){rosterLast=rosterSig();
  RB.innerHTML=roomTop();
  EB.innerHTML=`<div class="lb-row em">${[1,2,3].map(i=>emoBtn(i,!!(me&&me.em===i))).join('')}</div>`;
  const host=!room||isHost(),rl=host?durSel:hostDur();
  const chips=[60,90,120,180].map(v=>host?`<button type="button" class="chip" data-a="dur" data-v="${v}" aria-pressed="${v===durSel}">${mmss(v)}</button>`:`<span class="chip st" aria-pressed="${v===rl}">${mmss(v)}</span>`).join('');
  const busy=room&&anyInRound();
  LB.innerHTML=rosterPanel()+`<div class="roster-h">Round length${host?'':' (host picks)'}</div><div class="lb-row">${chips}</div><div class="lb-row">${host?`<button class="btn sm" data-a="startroom" type="button"${busy?' disabled':''}>${room?'Start round for everyone':'Start round'}</button>`:'<span class="lb-n">Waiting for the room host to start the round</span>'}</div>${busy?'<div class="lb-n">A round is in progress. You will join the next one.</div>':''}`}
function randLook(){const Rn=n=>Math.random()*n|0;myCol=SW[Rn(SW.length)];look.c=myCol;look.h=Rn(HATS.length);look.g=0;look.y=Rn(EYES.length);look.o=Rn(OUTS.length);look.p=Rn(PATS.length);look.l=Rn(SHOES.length)}
const LISTS={hat:()=>HATS,eye:()=>EYES,out:()=>OUTS,pat:()=>PATS,shoe:()=>SHOES};
function buildDress(){
  const row=(k,lab)=>{const L=LISTS[k](),cur=look[LKEY[k]]|0;return`<div class="ar"><span class="al">${lab}</span><button type="button" class="arw" data-a="step" data-k="${k}" data-d="-1" aria-label="Previous ${lab}">&#9664;</button><b class="av">${esc(L[cur])}</b><button type="button" class="arw" data-a="step" data-k="${k}" data-d="1" aria-label="Next ${lab}">&#9654;</button></div>`};
  DR.innerHTML=(`<h2>Dress your digital implementation manager</h2>
  <div class="dr"><canvas id="dv" width="220" height="260" aria-label="Your avatar"></canvas>
  <div class="dcol"><h3>Head</h3>${row('hat','Hat')}${row('eye','Eyes')}
  <h3>Body</h3>${row('out','Outfit')}${row('pat','Pattern')}<div class="ar"><span class="al">Colour</span><span class="sw">${SW.map(c=>`<button type="button" class="swb" data-a="col" data-v="${c}" style="background:${c}" aria-label="Colour ${c}" aria-pressed="${myCol===c}"></button>`).join('')}</span></div>
  <h3>Legs</h3>${row('shoe','Shoes')}</div></div>
  <div class="row"><button class="btn alt sm" data-a="rand" type="button">Surprise me</button></div>`)}
function refreshBar(){buildBar();buildDress()}
function applyLook(o){o.col=myCol;o.hat=look.h;o.gl=0;o.eye=look.y;o.fit=look.o;o.pat=look.p;o.shoe=look.l}
function lookChanged(){try{localStorage.setItem('ecoa-look',JSON.stringify(look))}catch(e){}
  if(me)applyLook(me);refreshBar();sendPres(true)}
function setEmote(v){if(!me)return;me.em=v;me.emT=v?3.5:0;sendPres(true);if(state.screen==='lobby')buildBar()}
function pickSpawn(){const free=SPAWNS.filter(x=>![...ghostMap.values()].some(g=>Math.abs(g.x+14-x)<30&&g.y>FY[0]-60));const P=free.length?free:SPAWNS;return P[Math.random()*P.length|0]}
function showLobby(){
  if(!lookRand){lookRand=true;randLook()}
  state.screen='lobby';setOv('',true);
  if(!me){me=mkBody(pickSpawn()-14,FY[0]-38);me.me=true;me.onG=true}
  applyLook(me);me.name=myName;me.em=0;
  refreshBar();sendPres(true)}

/* ---------- starting a round ---------- */
function onStart(d){if(!d||(state.screen!=='lobby'&&state.screen!=='result'))return;beginRound(d.seed|0,clamp(d.dur|0,30,300),clamp(d.n|0,1,40))}
function startRoom(){
  if(room&&!isHost())return;if(room&&anyInRound()){flash('A round is still running','#FF8A6B');return}
  const seed=(Math.random()*2147483647)|0,dur=durSel,n=1+[...ghostMap.values()].filter(g=>g.st==='lobby'||g.st==='res').length;
  if(room)try{room.emit('start',{seed,dur,n}).catch(()=>{})}catch(e){}
  beginRound(seed,dur,n)}
const snap=(name,col,o)=>({name,col,look:{col,hat:o.hat,gl:0,eye:o.eye,fit:o.fit,pat:o.pat,shoe:o.shoe}});
function syncRoster(){if(!R)return;
  R.roster.set(myJoin,snap(myName||'You',myCol,{hat:look.h,eye:look.y,fit:look.o,pat:look.p,shoe:look.l}));
  for(const g of ghostMap.values()){if(!g.j)continue;if(R.roster.has(g.j)||g.st==='count'||g.st==='play')R.roster.set(g.j,snap(g.name,g.col,g))}}
function beginRound(seed,dur,n){
  const list=genFinds(seed,n,dur);
  R={seed,dur,n,list,byId:new Map(list.map(f=>[f.id,f])),done:new Map(),pend:new Set(),pendAt:new Map(),sc:new Map(),roster:new Map(),
     t0:performance.now()+4000,t:-4,over:false,feed:[],pops:[],hold:null,near:null,lastSync:0,cdLast:5,stats:{}};
  for(const g of ghostMap.values())if(g.j&&(g.st==='lobby'||g.st==='res'||g.st==='count'))R.roster.set(g.j,snap(g.name,g.col,g));
  syncRoster();
  const ids=[myJoin].concat([...ghostMap.values()].filter(g=>g.j&&(g.st==='lobby'||g.st==='res')).map(g=>g.j)).sort((a,b)=>a-b),rk=Math.max(0,ids.indexOf(myJoin));
  me.x=SPAWNS[rk%SPAWNS.length]-14;me.y=FY[0]-38;me.vx=me.vy=0;me.onG=true;me.plat=null;me.em=0;
  state.screen='count';setOv('',true);state.toast=null;parts=[];sendPres(true)}
function startPlay(){state.screen='play';SFX.go();me.vx=0;R.lastSync=performance.now();sendPres(true)}

/* ---------- findings: claims, host resolution, scoring ---------- */
function nameOf(j){if(j===myJoin)return 'You';const r=R&&R.roster.get(j);return r?r.name:'Someone'}
function addScore(j,f){const s=R.sc.get(j)||{p:0,n:0};s.p+=f.pts;s.n++;R.sc.set(j,s)}
function recompute(){R.sc=new Map();for(const[id,j]of R.done){const f=R.byId.get(id);if(f)addScore(j,f)}}
function setDone(f,j,fx){
  const lost=R.pend.has(f.id)&&j!==myJoin;
  R.done.set(f.id,j);R.pend.delete(f.id);R.pendAt.delete(f.id);addScore(j,f);
  if(!fx)return;
  const mine=j===myJoin;
  burst(f.x,f.y-14,mine?'#2BD97B':'#FFC83D',mine?18:9,mine?230:150,100);
  R.pops.push({x:f.x,y:f.y-34,s:'+'+f.pts,col:mine?'#2BD97B':'#FFC83D',t:1.1});
  R.feed.unshift({s:(mine?'You fixed':nameOf(j)+' fixed')+': '+f.lab+(f.crit?'  +3':''),col:mine?'#9CF5C2':'#fff',at:performance.now()});if(R.feed.length>3)R.feed.length=3;
  if(mine){f.crit?SFX.win():SFX.good()}
  if(lost)flash(nameOf(j)+' got there first','#FF8A6B')}
function resolve(id,j){
  const f=R&&R.byId.get(id);if(!f||R.over||R.done.has(id))return false;
  const age=R.t-f.t0;if(age<-.5||age>f.ttl+1.5)return false;
  setDone(f,j,true);
  if(room)try{room.emit('fixed',{id,j}).catch(()=>{})}catch(e){}
  return true}
function claimFind(f){
  R.hold=null;
  if(!room||isHost()){resolve(f.id,myJoin)}
  else{R.pend.add(f.id);R.pendAt.set(f.id,performance.now());try{room.emit('claim',{id:f.id,j:myJoin}).catch(()=>{})}catch(e){}}}
function onClaim(d){if(!R||R.over||!d||!isHost())return;resolve(d.id|0,+d.j||0)}
function onFixed(d){if(!R||!d)return;const f=R.byId.get(d.id|0);if(!f||R.done.has(f.id))return;setDone(f,+d.j||0,true);if(R.over&&state.screen==='result')renderResult()}
function syncPayload(){const p=[],d=[];for(const[id,j]of R.done){let k=p.indexOf(j);if(k<0){k=p.length;p.push(j)}d.push([id,k])}return{p,d}}
function applySync(d){
  if(!R||!d)return;const p=Array.isArray(d.p)?d.p:[],m=new Map();
  for(const a of (Array.isArray(d.d)?d.d:[])){const id=a[0]|0,j=+p[a[1]|0];if(R.byId.has(id)&&j)m.set(id,j)}
  R.done=m;for(const id of [...R.pend])if(m.has(id)){R.pend.delete(id);R.pendAt.delete(id)}
  recompute();syncRoster()}
function onSync(d){if(!R||isHost()||R.over&&state.screen!=='result')return;applySync(d);if(state.screen==='result')renderResult()}
function onEnd(d){if(!R||(state.screen!=='play'&&state.screen!=='result'))return;if(!isHost())applySync(d);if(!R.over)endRound(true);else if(state.screen==='result')renderResult()}
function endRound(fromNet){
  if(!R||R.over)return;R.over=true;R.hold=null;
  if(!fromNet&&room&&isHost())try{room.emit('end',syncPayload()).catch(()=>{})}catch(e){}
  showResult()}
function stepFix(dt){
  if(!R||R.over||R.t<0)return;let best=null,bd=1e9;
  for(const f of R.list){const age=R.t-f.t0;if(age<0||age>f.ttl||R.done.has(f.id)||R.pend.has(f.id))continue;
    const dx=Math.abs(me.x+me.w/2-f.x),dy=(me.y+me.h)-f.y;
    if(dx<=22&&dy>-10&&dy<=4&&dx<bd){bd=dx;best=f}}
  R.near=best;
  if(best){if(!R.hold||R.hold.id!==best.id)R.hold={id:best.id,t:0};R.hold.t+=dt;if(R.hold.t>=best.need)claimFind(best)}
  else R.hold=null}

/* ---------- results ---------- */
function standings(){const rows=[];if(!R)return rows;
  for(const[j,r]of R.roster){const s=R.sc.get(j)||{p:0,n:0};rows.push({j,name:r.name,col:r.col,look:r.look,p:s.p,n:s.n,me:j===myJoin})}
  rows.sort((a,b)=>(b.p-a.p)||(b.n-a.n)||(a.j-b.j));return rows}
function avatarImg(lk){try{const c=document.createElement('canvas');c.width=96;c.height=116;
  withCtx(c.getContext('2d'),()=>{cx.clearRect(0,0,96,116);const k=1.9;cx.save();cx.scale(k,k);
    const r=Object.assign({},lk,{x:48/k-14,y:104/k-38,w:28,h:38,vx:0,vy:0,onG:true,walk:0,face:1,stun:0,inv:0,respawn:0,out:false,fin:false,name:'',em:0});
    const sc=state.cam;state.cam=0;drawRunner(r,0,false,true);state.cam=sc;cx.restore()});
  return c.toDataURL()}catch(e){return''}}
function resultHTML(){
  const rows=standings(),top=rows.filter(r=>r.p>0).slice(0,3),w=top[0],host=!room||isHost();
  const head=!w?'Round over':w.me?'You fixed the most!':esc(w.name)+' wins!';
  const mr=rows.find(r=>r.me),bp=bestPts[R.dur]||0;
  const pl=(n,a,b)=>n+' '+(n===1?a:b);
  const sub=!w?'Nobody fixed a finding this round.':(mr&&mr.p>0?`You fixed ${pl(mr.n,'finding','findings')} for ${pl(mr.p,'point','points')}.`:'You did not score this round.')+(bp?` Your best at ${mmss(R.dur)} is ${pl(bp,'point','points')}.`:'');
  const order=[1,0,2].filter(i=>top[i]);
  const pod=top.length?`<div class="podium" role="group" aria-label="Podium">${order.map(i=>{const r=top[i];return`<div class="pod"><img alt="" src="${avatarImg(r.look)}" width="80" height="97"><b>${esc(r.name)}</b><small>${pl(r.p,'pt','pts')}</small><div class="blk" style="height:${[64,46,34][i]}px;background:${['#FFC83D','#C9D1DC','#D68A4E'][i]}">${i+1}</div></div>`}).join('')}</div>`:'';
  const tb=`<table class="tbl rk"><thead><tr><th>#</th><th>Player</th><th class="r">Fixed</th><th class="r">Points</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i+1}</td><td>${esc(r.name)}${r.me?' (you)':''}</td><td class="r">${r.n}</td><td class="r">${r.p}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="card res"><h2 class="hero">${head}</h2><p class="sub">${esc(sub)}</p>${pod}${tb}<div class="row">${host?`<button class="btn" data-a="startroom" type="button">${room?'Play again for everyone':'Play again'}</button>`:''}<button class="btn ${host?'ghost ':''}sm" data-a="lobby" type="button">Back to the tower</button></div>${host?'':'<p class="sub">The host can start another round.</p>'}</div>`}
function renderResult(){if(state.screen==='result'&&R)OV.innerHTML=resultHTML()}
function showResult(){
  state.screen='result';me.em=0;
  const mr=standings().find(r=>r.me);if(mr&&mr.p>(bestPts[R.dur]||0)){bestPts[R.dur]=mr.p;try{localStorage.setItem('ecoa-tower-best',JSON.stringify(bestPts))}catch(e){}}
  renderResult();OV.className='';
  const cs=['#FFC83D','#FF5436','#46D6C4','#9783FF','#FF6B9A','#fff'];
  for(let i=0;i<7;i++)setTimeout(()=>{if(state.screen!=='result')return;burst(80+Math.random()*800,60+Math.random()*340,cs[i%6],26,260,80);if(i%2)SFX.coin()},i*260);
  SFX.win();sendPres(true)}

/* ---------- drawing ---------- */
function pill(x,y,w,h,col){rr(x,y,w,h,h/2);cx.fillStyle=col||'rgba(23,32,58,.9)';cx.fill()}
function activeFind(f){return !R.over&&R.t>=f.t0&&R.t<f.t0+f.ttl&&!R.done.has(f.id)}
function drawFinds(t,top){
  for(const f of R.list){if(!activeFind(f))continue;
    if(!top)drawFindBody(f,t,R.t,R.pend.has(f.id));
    else drawFindTop(f,t,R.t,R.near&&R.near.id===f.id,R.hold&&R.hold.id===f.id?R.hold.t:0)}}
function drawHUD(t){
  const left=Math.max(0,R.dur-R.t),sc=R.sc.get(myJoin)||{p:0,n:0},low=left<10&&state.screen==='play';
  pill(12,10,158,42,low&&Math.floor(t*3)%2?'#C93A20':undefined);txt('TIME',28,31,12,low?'#fff':'#9FB0D6','left');txt(mmss(left),66,31,28,low?'#fff':C.gold,'left');
  let open=0;for(const f of R.list)if(activeFind(f)&&!R.pend.has(f.id))open++;
  pill(12,56,104,17,'rgba(23,32,58,.78)');txt('Open findings: '+open,64,65,11,'#fff','center');
  pill(W-226,10,214,42);txt(String(sc.p),W-206,31,28,C.gold,'left');txt('pts',W-206+(String(sc.p).length*17)+4,34,13,'#9FB0D6','left');txt(sc.n+' fixed',W-22,31,16,'#fff','right');
  /* ticker on the ground strip */
  const fd=R.feed[0],age=fd?(performance.now()-fd.at)/1000:99;
  if(fd&&age<4.5){cx.globalAlpha=clamp(4.5-age,0,1);txt(fd.s,W/2,FY[0]+22,17,fd.col,'center',['#0B6E66',5]);cx.globalAlpha=1}
  else if(state.screen==='play'&&R.t<8)txt('Stand next to a finding to fix it',W/2,FY[0]+22,17,'#fff','center',['#0B6E66',5])}
function drawPops(){
  for(const p of R.pops){const a=clamp(p.t/.5,0,1),yy=p.y-(1.1-p.t)*34;cx.globalAlpha=a;txt(p.s,p.x,yy,22,p.col,'center',[C.ink,5]);cx.globalAlpha=1}}
function drawToast(){const T=state.toast;if(!T||T.t<=0)return;cx.globalAlpha=clamp(T.t/.5,0,1);cx.font='800 15px '+FD;const w=cx.measureText(T.msg).width+30;pill(W/2-w/2,84,w,28,'rgba(23,32,58,.92)');txt(T.msg,W/2,98.5,15,T.col,'center');cx.globalAlpha=1}
function drawScene(now,dt){
  const t=now/1000,sc=state.screen;
  drawTower(t,dt);
  const inR=sc==='count'||sc==='play';
  if(R&&inR)drawFinds(t,false);
  const crowd=visibleGhosts().sort((p,q)=>p.y-q.y);
  for(const g of crowd){g.nameA=.9;drawRunner(g,t,false,true)}
  if(me)drawRunner(me,t,true,true);
  if(R&&inR)drawFinds(t,true);
  drawParts();
  if(R&&(inR||sc==='result'))drawPops();
  if(sc==='lobby'||sc==='title'){
    if(sc==='lobby'){const n=1+ghostMap.size,s=(room?'Room '+roomCode+'   '+n+' here':'Practice tower');cx.font='800 16px '+FD;const w=cx.measureText(s).width+26;rr(10,10,w,32,16);cx.fillStyle='rgba(23,32,58,.88)';cx.fill();txt(s,23,26,16,'#fff','left');
      const late=room&&anyInRound(),msg=netMsg?netMsg:late?'A round is in progress. You will join the next one.':(!room?'Run around to warm up. Press Start round when you are ready.':n===1?'Waiting for teammates. Share the invite link or room code.':(isHost()?'You are the room host. Choose a round length and press Start.':'Warm up in the tower. The host starts the round.'));
      txt(msg,W/2,FY[0]+22,17,netMsg||late?'#FFE08A':'#fff','center',['#0B6E66',5])}}
  else if(R&&inR){
    drawHUD(t);
    if(sc==='count'){const cd=-R.t;cx.fillStyle='rgba(23,32,58,.5)';cx.fillRect(0,0,W,H);
      txt('Get ready to fix findings',W/2,150,38,'#fff','center',[C.ink,9]);txt('Stand next to a finding. Purple ones are worth 3.',W/2,194,19,C.gold,'center',[C.ink,6]);
      const n=Math.ceil(cd);if(n>=1&&n<=3){const k=1+(cd%1)*.5;cx.save();cx.translate(W/2,H/2+40);cx.scale(k,k);txt(String(n),0,0,120,'#fff','center',[C.ink,14]);cx.restore()}
      else if(n>3)txt('Get set',W/2,H/2+40,60,'#fff','center',[C.ink,10])}
    if(sc==='play'&&R.t>=0&&R.t<.9){const k=1+R.t*.5;cx.save();cx.globalAlpha=1-R.t/.9;cx.translate(W/2,H/2);cx.scale(k,k);txt('GO!',0,0,130,C.gold,'center',[C.ink,14]);cx.restore()}}
  drawToast()}

/* ---------- live leaderboard ---------- */
const BD=document.getElementById('board'),BDI=document.getElementById('bdIn'),bdRows=new Map();let bdT=0;
function updateBoard(now){
  if(typeof BDI.appendChild!=='function'||now-bdT<150||!R)return;bdT=now;
  const ents=standings().sort((a,b)=>(b.p-a.p)||(b.n-a.n)||(a.j-b.j));
  const n=ents.length,cols=n>7?2:1,per=Math.ceil(n/cols),RH=32;BDI.style.height=per*RH-4+'px';
  const seen=new Set();
  ents.forEach((e,i)=>{seen.add(e.j);let o=bdRows.get(e.j);
    if(!o){const el=document.createElement('div');el.className='bd-row';el.innerHTML='<b class="bn"></b><i></i><span class="bnm"></span><span class="bpc"></span>';BDI.appendChild(el);o={el,rank:i,nn:el.children[0],dot:el.children[1],nm:el.children[2],pc:el.children[3],ft:0};bdRows.set(e.j,o)}
    if(i!==o.rank){o.el.classList.remove('up','dn');void o.el.offsetWidth;o.el.classList.add(i<o.rank?'up':'dn');clearTimeout(o.ft);o.ft=setTimeout(()=>o.el.classList.remove('up','dn'),700);o.rank=i}
    const col=i%per,cI=Math.floor(i/per),w=100/cols;
    o.el.style.width='calc('+w+'% - '+(cols>1?4:0)+'px)';o.el.style.transform='translate('+(cI?'calc(100% + 8px)':'0px')+','+col*RH+'px)';
    o.el.classList.toggle('me',!!e.me);
    o.nn.textContent=i+1;o.dot.style.background=e.col||'#fff';o.nm.textContent=e.name+(e.me?' (you)':'');o.pc.textContent=e.n+' fixed · '+e.p+' pts'});
  for(const[k,o]of bdRows)if(!seen.has(k)){o.el.remove();bdRows.delete(k)}}

/* ---------- actions and input ---------- */
const ACT={
  solo(){readForm();startSolo()},
  join(){const rc=readForm();joinRoom(rc)},
  startroom:startRoom,
  lobby(){showLobby()},
  leave:leaveRoom,
  dur(b){durSel=clamp(+b.dataset.v|0,30,300);buildBar();sendPres(true)},
  col(b){myCol=b.dataset.v;look.c=myCol;lookChanged()},
  step(b){const k=b.dataset.k,L=LISTS[k]&&LISTS[k](),lk=LKEY[k];if(!L)return;look[lk]=((look[lk]|0)+(+b.dataset.d)+L.length)%L.length;lookChanged()},
  rand(){randLook();lookChanged()},
  emo(b){if(!me)return;const v=clamp(+b.dataset.v|0,1,3);SFX.good();setEmote(me.em===v?0:v)},
  copylink(b){const u=location.origin&&location.origin!=='null'?location.origin+location.pathname:location.href.split('?')[0];copyText(u+'?room='+encodeURIComponent(roomCode),b,'Link copied!')},
  copycode(b){copyText(roomCode,b,'Code copied!')}};
for(const el of[LB,RB,EB,DR,OV])el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&ACT[b.dataset.a]){beep(660,.06,'triangle',.06);ACT[b.dataset.a](b);b.blur()}});
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
const PLAYING=()=>['lobby','count','play','result'].includes(state.screen);
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if((state.screen==='lobby')&&/^Digit[1-3]$/.test(e.code)){if(!e.repeat)ACT.emo({dataset:{v:e.code.slice(5)}});return}
  const k=KM[e.code];if(!k)return;
  if(PLAYING())e.preventDefault();if(e.repeat)return;
  if(k==='j'){inp.j=true;inp.jp=true}else inp[k]=true});
addEventListener('keyup',e=>{const k=KM[e.code];if(!k)return;inp[k]=false});
addEventListener('blur',()=>{inp.l=inp.r=inp.j=false});
function bindBtn(id,k){const b=document.getElementById(id);
  const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');if(k==='j'){inp.j=true;inp.jp=true}else inp[k]=true};
  const off=()=>{b.classList.remove('on');inp[k]=false};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault())}
bindBtn('bL','l');bindBtn('bR','r');bindBtn('bJ','j');
{const eb=document.getElementById('exitg');let et=0;
  eb.addEventListener('click',()=>{if(!et){eb.textContent='Tap again to exit';et=setTimeout(()=>{et=0;eb.textContent='Exit game'},3000);return}
    clearTimeout(et);et=0;eb.textContent='Exit game';leaveRoom()})}
document.getElementById('leaveb').addEventListener('click',()=>leaveRoom());
document.getElementById('mute').addEventListener('click',e=>{muted=!muted;e.target.textContent='Sound: '+(muted?'off':'on')});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  {const S=Math.min(2,Math.max(1,Math.round(((cv.clientWidth||960)*(window.devicePixelRatio||1)/960)*4)/4));
   if(cv.width!==Math.round(960*S)){cv.width=Math.round(960*S);cv.height=Math.round(540*S)}
   cx.setTransform(cv.width/960,0,0,cv.width/960,0,0)}
  const sc0=state.screen;
  {const eb=document.getElementById('exitg');if(eb)eb.hidden=sc0==='title';const lb=document.getElementById('leaveb');if(lb)lb.hidden=!(sc0==='lobby'&&room)}
  LB.hidden=sc0!=='lobby';RB.hidden=!(sc0==='lobby'&&room);EB.hidden=sc0!=='lobby';DR.hidden=sc0!=='lobby';APP.classList.toggle('lobby',sc0==='lobby');
  {const on=sc0==='count'||sc0==='play';if(BD.hidden===on)BD.hidden=!on;if(!on&&bdRows.size){for(const o of bdRows.values())o.el.remove();bdRows.clear()}else if(on)updateBoard(now)}
  const dt=Math.min(.05,(now-last)/1000);last=now;
  /* round clock */
  if(R&&(state.screen==='count'||state.screen==='play')){
    R.t=(now-R.t0)/1000;
    if(state.screen==='count'){const n=Math.ceil(-R.t);if(n!==R.cdLast&&n>=1&&n<=3){R.cdLast=n;SFX.tick()}if(R.t>=0)startPlay()}
    if(state.screen==='play'){
      if(R.t>=R.dur)endRound(false);
      else if(room&&isHost()&&now-R.lastSync>1500){R.lastSync=now;try{room.emit('sync',syncPayload()).catch(()=>{})}catch(e){}}
      for(const id of [...R.pend]){if(now-(R.pendAt.get(id)||0)>3000){R.pend.delete(id);R.pendAt.delete(id)}}}}
  /* physics */
  const sec=clock(),sc=state.screen,mv=me&&(sc==='lobby'||sc==='play'||sc==='result');
  if(sc==='title'){updElev(sec)}
  else{
    acc+=dt;const K=Math.floor(acc/DT);acc-=K*DT;
    const heads=mv?visibleGhosts():null;
    if(mv&&me.em&&((inp.l||inp.r)||inp.jp)){setEmote(0)}
    for(let k=0;k<K;k++){updElev(sec-(K-1-k)*DT);if(mv){stepBody(me,DT,inp,heads);if(sc==='play')stepFix(DT)}}
    if(K===0)updElev(sec);
    if(mv&&me.em){me.emT-=dt;if(me.emT<=0)setEmote(0)}
    if(sc==='count'&&me){me.vx=0;me.walk=0}
    if(me&&room){pacc+=dt;if(pacc>.1){pacc=0;sendPres()}}}
  for(const g of ghostMap.values()){const tx=g.tx===undefined?g.x:g.tx,ty=g.ty===undefined?g.y:g.ty;
    g.vx=(tx-g.x)*8;g.vy=(ty-g.y)*8;g.x+=(tx-g.x)*Math.min(1,dt*10);g.y+=(ty-g.y)*Math.min(1,dt*10);g.walk+=Math.abs(g.vx)*dt*.06;g.onG=Math.abs(g.vy)<40}
  stepParts(dt);if(state.toast)state.toast.t-=dt;
  if(R){for(const p of R.pops)p.t-=dt;R.pops=R.pops.filter(p=>p.t>0)}
  if(sc==='lobby'&&room){const sg=rosterSig();if(sg!==rosterLast){rosterLast=sg;buildBar()}}
  if(sc==='lobby'){const dv=document.getElementById('dv');if(dv)drawDressPreview(dv,now/1000,{col:myCol,hat:look.h,gl:0,eye:look.y,fit:look.o,pat:look.p,shoe:look.l})}
  drawScene(now,dt);
  requestAnimationFrame(frame)}

(function boot(){
  const go=()=>{showTitle();requestAnimationFrame(t=>{last=t;frame(t)})};
  if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('800 20px "Baloo 2"'),document.fonts.load('700 14px "Figtree"')]),new Promise(r=>setTimeout(r,1500))]).then(go,go)}else go();
})();
</script>
