<title>eCOA Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<main id="app">
  <div id="cap" hidden></div>
  <div id="roombar" hidden></div>
  <div id="stage">
    <canvas id="c" width="800" height="450" aria-label="eCOA Rush race course"></canvas>
    <button class="btn sm ghost" id="skip" type="button" hidden>Skip preview</button>
    <div id="ov"></div>
  </div>
  <div id="emobar" hidden></div>
  <div id="lobbybar" hidden></div>
  <aside id="dress" hidden></aside>
  <div id="pad">
    <div class="grp"><button class="pb" id="bL" aria-label="Move left">&#9664;</button><button class="pb" id="bR" aria-label="Move right">&#9654;</button></div>
    <button class="pb jump" id="bJ" aria-label="Jump">JUMP</button>
    <button class="pb jump" id="bB" aria-label="Boost">BOOST</button>
  </div>
  <div id="hint"><span class="keys"><span class="kh">How to move</span><span class="kg">Run <span class="kc">&larr;</span><span class="kc">&rarr;</span><i>or</i><span class="kc">A</span><span class="kc">D</span></span><span class="kg">Jump <span class="kc" style="min-width:70px">Space</span><i>or</i><span class="kc">W</span><span class="kc">&uarr;</span></span><span class="kg">Boost <span class="kc">Shift</span><i>or</i><span class="kc">B</span></span></span><span class="hbtns"><button id="leaveb" type="button" hidden>Leave room</button><button id="exitg" type="button" hidden>Exit game</button><button id="mute" type="button">Sound: on</button></span></div>
  <div id="board" hidden><div class="bd-h">Live leaderboard</div><div id="bdIn"></div></div>

<script src="shared/avatar.js"></script>
<script src="shared/room.js"></script>
<script src="shared/lobby.js"></script>
<script src="shared/board.js"></script>
<script src="shared/input.js"></script>
<script>
'use strict';
const W=800,H=450,GY=340,DT=1/120;

/* ---------- the route: 7 milestones, 6 stretches, one hazard each ---------- */
const RACE={name:'Race to FPI',seed:5,pace:186,slack:3.8,limit:200,
 startGates:{0:'Start Licence Agreements',1:'Start Design Meetings',3:'Start UAT'},sky:['Start Licence Agreements','Start Design Meetings','Start UAT'],
 gates:['eCOA KOM','Licensing Complete',null,'eCOA Design Approved','UAT Finish','Go Live','FPI'],
 legs:[
  {k:'lic',short:'Jump over licence agreements',name:'Licensing delays',col:'#F2A81D',head:'Each hurdle is a licence agreement that still needs signing.',how:'Jump over a hurdle to get that agreement signed. This is the warm-up.',real:'The eCOA licence and contract agreements must be signed before work can start.',tip:'Start licence and contract signatures at kickoff.',segs:['hurdles','hurdles','tok','hurdles','hurdles']},
  {k:'dm',short:'Navigate Design Decisions',name:'Design decisions',col:'#D14FE8',head:'The design questionnaire is a gap in the floor. You cross it on tick boxes, a Likert scale, a dropdown list, an NRS pain scale, a VAS lift, a time picker, a number spinner and a faces pain scale.',how:'Hop across the tick boxes and the Likert scale, hop down the dropdown list, cross the NRS bridge, take the rising VAS lift, run against the time picker wheels, climb the number spinner and finish up the faces pain scale. Do not fall in.',real:'Design decisions such as alerts, scoring, triggers and integrations must be agreed before the eCOA design can be approved.',tip:'Agree design decisions early and share drafts before the meetings.',segs:['cbx','rest60','likert','rest0','dropdown','rest20','nrs','rest0','vasv','rest50','timepick','cbx2','rest0b','spinner','faces','stage']},
  {k:'amd',short:'Dodge protocol amendments',name:'Protocol amendments',col:'#6B4EFF',sponsor:1.6,head:'The Sponsor floats above and drops protocol amendments in front of you.',how:'Watch for the red ! marker, then jump over the paper stack.',real:'The protocol changes mid-build, so screens and edit checks need rework.',tip:'Lock the protocol before design approval and agree change control.',segs:['tok','flat','tok','flat','tok','flat']},
  {k:'uat',short:'Crush UAT bugs',name:'UAT findings',col:'#FF8A3D',head:'UAT findings are bugs crawling along the ground.',how:'Jump on top of a bug to fix it and earn a token. If you run into one from the side, you stumble.',real:'Defects found in user acceptance testing must be fixed and retested.',tip:'Write clear test scripts and fix defects in batches.',segs:['bugs','tok','bugs','bugs','tok','bugs','bugs']},
  {k:'aud',short:'Dodge audit findings',name:'Audit findings',col:'#FF5436',head:'A giant AUDIT FINDING stamp slams down on a rhythm.',how:'Wait while it shakes, then run through the gap right after each slam.',real:'Documentation gaps found in quality review must be closed before go-live.',tip:'Keep documentation inspection-ready as you build.',segs:['press2','press3','tokS','press3','press4','tokS','press4','press4']},
  {k:'fin',short:'',name:'Final run to FPI',col:'#12A594',sponsor:2.4,maxDrops:2,head:'The Sponsor is back for two last amendments.',how:'Jump them, then cross the FPI line.',real:'Sites are activated and the first patient is enrolled.',tip:'Confirm site readiness and device shipments before go-live.',segs:['tok','tok']}
 ]};
const LANGS=['EN>ES','EN>DE','EN>FR','EN>JA','EN>ZH','EN>IT'];
const LANGN=['US English','US Spanish','French','German'],LCODE=['EN-US','ES-US','FR','DE'];
const MEETN=['Alerts','Scoring','Triggers','Integrations','Schedules','Reminders'];
const VSAY=[
 {idle:['Quote pending...','Is the source text final?','Please hold','Which version, exactly?','Out of office until Monday'],react:['Ouch! Fine, translating...','Delivered. Invoice to follow.','Rush fee applied!']},
 {idle:['Cotización pendiente...','¿El texto fuente es final?','Un momento, por favor','¿Qué versión, exactamente?','Fuera hasta el lunes'],react:['¡Ay! Traduciendo...','Entregado. Factura en camino.','¡Recargo por urgencia!']},
 {idle:['Devis en attente...','Le texte source est final ?','Veuillez patienter','Quelle version, exactement ?','Absent jusqu’à lundi'],react:['Aïe ! Je traduis...','Livré. Facture à suivre.','Supplément urgence !']},
 {idle:['Angebot ausstehend...','Ist der Quelltext final?','Bitte warten','Welche Version genau?','Bis Montag im Urlaub'],react:['Autsch! Ich übersetze...','Geliefert. Rechnung folgt.','Eilzuschlag berechnet!']}];
const AGREE=['HIT-6','EQ-5D','PHQ-9','SF-36','MIDAS','PROMIS','WPAI','C-SSRS'];

/* ---------- level builder ---------- */
function build(cfg){
  const R=rng(cfg.seed),L={rects:[],haz:[],toks:[],gates:[],zones:[],doors:[],doorZones:[],presses:[],movers:[],cargo:[],fb:[],bugs:[],wheels:[],pends:[],tg:[],decor:[],legs:[],end:0,cfg};
  let x=0,D=0,lift=0;const G0=GY;
  const ground=w=>{L.rects.push({x,y:G0-lift,w,h:400+lift,k:'g'});x+=w};
  const tok=(tx,ty)=>L.toks.push({x:tx,y:ty,got:false,ph:R()*6});
  const arc=(x0,n,gap,base,bump)=>{for(let i=0;i<n;i++)tok(x0+i*gap,base-Math.sin(i/(n-1)*Math.PI)*bump)};
  const find=fx=>L.haz.push({x:fx,y:GY-30,w:30,h:30,t:'f'});
  const crate=(cx0)=>L.haz.push({x:cx0,y:GY-44,w:40,h:44,t:'c',lab:LANGS[Math.floor(R()*LANGS.length)]});
  const doors=groups=>{ground(110);const x0=x;let ph=R()*3.6;
    groups.forEach((n,gi)=>{for(let i=0;i<n;i++){const r={x:x,y:GY,w:70,h:400,k:'d',open:false,warn:false};L.rects.push(r);L.doors.push({r,ph,per:3.6,win:1.0,wn:.7});ph+=1.8;if((gi+i)%2===0)tok(r.x+35,GY-70);x+=70}
      if(gi<groups.length-1)ground(120)});
    L.doorZones.push({x:x0,w:x-x0});D+=.9;ground(150)};
  const segs={
    tokS(){const x0=x;ground(170);arc(x0+30,4,32,GY-24,34)},
    tok(){const x0=x;ground(260+R()*60);arc(x0+40,6,34,GY-24,46)},
    flat(){const x0=x;ground(300);arc(x0+90,3,36,GY-24,10)},
    find(){const x0=x;ground(330);find(x0+190);tok(x0+190,GY-112);tok(x0+160,GY-96);tok(x0+220,GY-96)},
    find2(){const x0=x;ground(430);find(x0+120);find(x0+270);arc(x0+100,8,24,GY-100,40)},
    hurdles(){const x0=x;ground(430);for(const hx of[x0+150,x0+340]){const n=L.haz.filter(h=>h.t==='h').length;L.haz.push({x:hx,y:GY-34,w:40,h:34,t:'h',lab:AGREE[n%AGREE.length],signed:false,first:n===0});
        tok(hx+20,GY-118);tok(hx-6,GY-96);tok(hx+46,GY-96)}},
    swing(){const x0=x;ground(570);const n=L.pends.length;
      L.pends.push({px:x0+285,py:14,L:312,A:.95,T:4.1+R()*.6,ph:R()*5,lab:MEETN[n%MEETN.length],done:false});
      arc(x0+40,3,30,GY-24,8);D+=.5},
    meet(){const x0=x;ground(560);const n=L.wheels.length;
      L.wheels.push({x0:x0+110,x1:x0+290,y:GY-44,w:44,h:44,ph:R()*6,v:78+R()*14,lab:MEETN[n%MEETN.length],done:false,first:n===0});
      L.wheels.push({x0:x0+340,x1:x0+500,y:GY-44,w:44,h:44,ph:R()*6,v:84+R()*14,lab:MEETN[(n+1)%MEETN.length],done:false,first:false});
      arc(x0+60,3,30,GY-24,8);arc(x0+300,3,30,GY-110,16);D+=.6},
    cbx(){const GY=G0-lift;ground(150);const gs=x,hs=[0,0,0],gaps=[92,98,100,92],bw=64;L.cargo.push({x:gs,w:0,k:'cbx',lift,tint:0,sign:'DESIGN DECISIONS',water:true});let px=gs;
      for(let i=0;i<3;i++){px+=gaps[i];const n=L.movers.filter(m=>m.cb).length;
        L.movers.push({x0:px,x1:px,y:GY-hs[i],w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:MEETN[n%MEETN.length]});tok(px+bw/2,GY-hs[i]-72);px+=bw}
      px+=gaps[3];L.cargo[L.cargo.length-1].w=px-gs;x=px;ground(170);D+=1.1},
    cbx2(){const GY=G0-lift;ground(150);const gs=x,hs=[0,46,0],gaps=[92,96,98,92],bw=64;L.cargo.push({x:gs,w:0,k:'cbx',lift,tint:3,lava:true,sign:'DESIGN DECISIONS'});let px=gs;
      for(let i=0;i<3;i++){if(i!==1)L.fb.push({x:px+gaps[i]/2,sy:GY+12,ap:130+i*8,per:2.5,dur:.5,ph:i*.7,lab:'Free text box'});px+=gaps[i];const n=L.movers.filter(m=>m.cb).length;
        L.movers.push({x0:px,x1:px,y:GY-hs[i],w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:MEETN[n%MEETN.length]});tok(px+bw/2,GY-hs[i]-72);px+=bw}
      px+=gaps[3];L.cargo[L.cargo.length-1].w=px-gs;x=px;ground(170);D+=1.2},
    likert(){const GY=G0-lift;ground(150);const gs=x,bw=64,gaps=[92,90,90,90,90,92],hs=[0,0,30,0,0],say=['Strongly disagree','Disagree','Neither agree nor disagree','Agree','Strongly agree'];
      const cg={x:gs,w:0,k:'cbx',lift,tint:2,chasm:true,sign:'LIKERT SCALE',endL:'Strongly disagree',endR:'Strongly agree',endAlign:true,endY:80};L.cargo.push(cg);let px=gs;
      for(let i=0;i<5;i++){px+=gaps[i];if(i===0)cg.xl=px+bw/2;if(i===4)cg.xr=px+bw/2;
        L.movers.push({x0:px,x1:px,y:GY-hs[i],w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:say[i],say:say[i],sk:'lik',grp:'lik',n:i+1});tok(px+bw/2,GY-hs[i]-72);if(i<4)tok(px+bw+gaps[i+1]/2,GY-150);px+=bw}
      px+=gaps[5];cg.w=px-gs;x=px;ground(170);D+=1.2},
    nrs(){const GY=G0-lift;ground(150);const gs=x,bw=34,ed=44;
      const cg={x:gs,w:0,k:'cbx',lift,sign:'NRS PAIN SCALE',water:true,bridge:true,endL:'No pain',endR:'Worst pain imaginable',endAlign:true};L.cargo.push(cg);let px=gs+ed;
      for(let i=0;i<11;i++){if(i===0)cg.xl=px;
        L.movers.push({x0:px,x1:px,y:GY,w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:String(i),say:'Pain '+i+' out of 10',sk:'nrs',grp:'nrs',n:i});if(i%2===0)tok(px+bw/2,GY-62);px+=bw;if(i===10)cg.xr=px}
      px+=ed;cg.w=px-gs;x=px;ground(170);D+=1.0},
    timepick(){const GY=G0-lift;ground(150);L.tp={h:null,m:null,done:false};
      const hw={x:x,y:GY,w:400,h:400+lift,k:'wh',belt:-80,N:24,step:1,cell:46,wl:'h',hl:-1};L.rects.push(hw);for(let i=0;i<5;i++)tok(x+50+i*75,GY-70);x+=400;
      L.cargo.push({x:x,w:70,k:'cbx',lift,chasm:true,sign:'TIME PICKER'});x+=70;
      const mw={x:x,y:GY-38,w:400,h:400+lift+38,k:'wh',belt:-90,N:12,step:5,cell:46,wl:'m',hl:-1};L.rects.push(mw);for(let i=0;i<5;i++)tok(x+50+i*75,GY-108);x+=400;
      L.tp.hw=hw;L.tp.mw=mw;L.tp.xEnd=x;ground(170);D+=1.3},
    dropdown(){const GY=G0-lift;ground(150);const lx=x;L.rects.push({x:x,y:GY-88,w:130,h:488,k:'g'});x+=130;
      const rows=['Screening','Baseline','Week 4','Week 12'],rw=100,zx=x;
      L.cargo.push({x:zx,w:rows.length*rw,k:'cbx',lift,sign:'DROPDOWN LIST',water:true,dd:{lx,lw:130}});
      rows.forEach((lab,i)=>{L.movers.push({x0:x,x1:x,y:GY-66+i*22,w:rw,h:14,ph:0,per:5,cb:true,tick:false,lab,say:'Visit: '+lab,sk:'dd',grp:'dd',n:i});tok(x+rw/2,GY-66+i*22-62);x+=rw});
      ground(170);D+=1.0},
    spinner(){const GY=G0-lift;ground(150);const zx=x,bw=64,gp=88,rise=22;
      const cg={x:zx,w:0,k:'cbx',lift,sign:'NUMBER SPINNER',lava:true,spin:{px:0}};L.cargo.push(cg);x+=gp;
      for(let i=0;i<5;i++){if(i===1||i===3)L.fb.push({x:x-gp/2,sy:GY+12,ap:140+i*14,per:2.5,dur:.5,ph:i*.9,lab:'Free text box'});L.movers.push({x0:x,x1:x,y:GY-rise*(i+1),w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:String(i+1),say:'Doses per day: '+(i+1),sk:'spin',grp:'spin',n:i+1});tok(x+bw/2,GY-rise*(i+1)-62);x+=bw+gp}
      x-=gp;cg.spin.px=x;cg.w=x-zx;L.rects.push({x:x,y:GY-rise*5,w:130,h:400+rise*5,k:'g'});x+=130;ground(170);D+=1.2},
    icf(){const GY=G0-lift;ground(150);const zx=x,doc=1000,sw=900;L.icf={x:zx,doc,sw,done:false,n:0,prog:0,show:false};
      L.cargo.push({x:zx,w:doc+sw,k:'icf',lift});L.rects.push({x:zx,y:GY,w:doc+sw,h:400+lift,k:'tm',belt:-40});
      const cl=['Clause 2.1','Clause 4.3','Clause 6.2','Clause 8.5'];cl.forEach((lab,k)=>{const hx=zx+210+k*200;L.haz.push({x:hx,y:GY-34,w:40,h:34,t:'c',lab,signed:false});tok(hx+20,GY-118)});
      for(let k=0;k<5;k++){const hx=zx+doc+90+k*170;L.haz.push({x:hx,y:GY-34,w:40,h:34,t:'c',lab:'Initial',ini:true,signed:false});tok(hx+20,GY-118)}
      x+=doc+sw;D+=1.6},
    faces(){const GY=G0-lift;ground(150);const gs=x,bw=64,gaps=[92,88,88,88,88,88,90],hs=[0,16,32,48,64,80],txtl=['No hurt','Hurts little bit','Hurts little more','Hurts even more','Hurts whole lot','Hurts worst'];
      const cg={x:gs,w:0,k:'cbx',lift,tint:1,chasm:true,sign:'FACES PAIN SCALE',endL:'0  No hurt',endR:'10  Hurts worst',endAlign:true,endY:80};L.cargo.push(cg);let px=gs;
      for(let i=0;i<6;i++){px+=gaps[i];if(i===0)cg.xl=px+bw/2;if(i===5)cg.xr=px+bw/2;
        L.movers.push({x0:px,x1:px,y:GY-hs[i],w:bw,h:14,ph:0,per:5,cb:true,tick:false,lab:'Pain '+i*2,say:'Pain '+i*2+': '+txtl[i],sk:'face',n:i});tok(px+bw/2,GY-hs[i]-72);px+=bw}
      px+=gaps[6];cg.w=px-gs;x=px;ground(170);D+=1.3},
    vasv(){const GY=G0-lift;ground(150);const gs=x,CW=104,LH=215,nm='Fatigue';L.cargo.push({x:gs,w:CW,k:'vasv',nm,lift,tint:1,LH});ground(CW);
      L.movers.push({x0:gs+22,x1:gs+22,y:GY-34,y1:GY-LH-6,w:70,h:14,ph:0,per:5.6,vas:true,vv:true,LH});
      L.rects.push({x:x,y:GY-LH,w:170,h:LH+400,k:'g',snow:true});arc(x+30,4,34,GY-LH-24,10);x+=170;ground(170);D+=1.3},
    vas(){const GY=G0-lift;ground(150);const gs=x,G=500,w=110,vi=L.cargo.filter(z=>z.k==='vas').length,nm=['Pain','Fatigue','Mood'][vi%3];L.cargo.push({x:gs,w:G,k:'vas',nm,lift,tint:0,chasm:true});
      L.movers.push({x0:gs-12,x1:gs+G-w+12,y:GY,w,h:14,ph:0,per:5.2,vas:true});
      x+=G;ground(170);arc(gs+40,6,56,GY-74,16);D+=1.3},
    rest0(){segs.rest(0,2)},rest60(){segs.rest(60,0)},rest50(){segs.rest(50,3)},rest20(){segs.rest(20,5)},rest0b(){segs.rest(0,7)},rest0c(){segs.rest(0,8)},
    rest(lv,q){lift=lv;const GY=G0-lv,x0=x;ground(170);arc(x0+25,3,34,GY-24,8);D+=.2},
    stage(){lift=64;const x0=x;ground(150);arc(x0+30,3,34,G0-64-30,14)},
    bugs(){const x0=x;ground(540);const f=L.bugs.length===0;
      for(const [a0,a1,v] of [[60,170,80],[225,335,90],[390,500,85]])L.bugs.push({x0:x0+a0,x1:x0+a1,y:GY-26,w:34,h:26,ph:R()*6,v,first:L.bugs.length===0,fixed:false});
      arc(x0+90,5,28,GY-92,22);arc(x0+255,5,28,GY-92,22);arc(x0+420,5,28,GY-92,22)},
    tgate(){const x0=x,gi=L.tg.length;ground(620);
      const vs=[{x0:x0+340,x1:x0+340,y:GY-46,w:44,h:46,ph:0,v:0}];
      L.tg.push({x:x0+430,w:120,need:1,names:[LCODE[gi%4]],lang:LANGN[gi%4],i:gi,first:gi===0,pad:{x:x0+250,w:160},vs,v:vs[0]});
      arc(x0+40,4,34,GY-24,14);arc(x0+175,4,30,GY-24,12);D+=1.4},
    pressN(n){const sp=n===1?120:88+Math.floor(R()*10);const x0=x;ground(n*sp+200);const S0=R()*2.7;
      for(let k=0;k<n;k++){const S=S0+k*sp/212+(k?(R()-.5)*.5:0);L.presses.push({x:x0+120+k*sp,w:84,ph:2.9-S,per:2.7,warn:.42,down:.5,first:false})}
      arc(x0+30,2,34,GY-24,8);D+=.5+.35*n},
    press1(){segs.pressN(1)},press2(){segs.pressN(2)},press3(){segs.pressN(3)},press4(){segs.pressN(4)},
    cargo(){ground(150);const gs=x,G=340,w=100;L.cargo.push({x:gs,w:G});
      for(let k=0;k<2;k++)L.movers.push({x0:gs-12,x1:gs+G-w+12,y:GY,w,h:14,ph:k*2.6,per:5.2,lab:LANGS[Math.floor(R()*LANGS.length)]});
      x+=G;ground(170);arc(gs+40,6,56,GY-74,16);D+=1.3},
    doorsA(){doors([2,1,2])},doorsB(){doors([1,2,1,2])},
    trc(){const x0=x;ground(430);crate(x0+130);crate(x0+300);arc(x0+100,8,24,GY-104,40);D+=.3},
    lic(){const x0=x;ground(340);L.zones.push({x:x0+40,w:260,k:'lic',lab:'LICENCE PENDING'});arc(x0+60,6,38,GY-26,30);D+=.8},
  };
  ground(520);
  for(let i=0;i<cfg.legs.length;i++){
    const lg=cfg.legs[i],leg=Object.assign({},lg,{a:x,b:0,i});
    if(cfg.startGates&&cfg.startGates[i]){ground(i===0?40:150);L.gates.push({x:x,label:cfg.startGates[i],st:0,t:0,sky:true});ground(i===0?60:80)}
    for(const s of lg.segs)segs[s]();
    if(lg.sponsor)D+=.7;
    ground(120);leg.b=x;L.legs.push(leg);
    if(i<cfg.legs.length-1){const gl=cfg.gates[i+1];
      if(gl){L.gates.push({x:x,label:gl,st:0,t:0,lift,sky:cfg.sky.includes(gl)});const gx=x;
        ground(gl==='UAT Finish'?470:(cfg.startGates&&cfg.startGates[i+1]?290:200));
        if(gl==='UAT Finish'){L.decor.push({x:gx+260,k:'siren',ph:0,lift:0},{x:gx+355,k:'siren',ph:1.6,lift:0,pair:true})}}
      else ground(160);
      lift=0}

  for(const g of state.ghosts)ents.push({id:bdId(g),name:g.name||'Player',col:g.col,x:g.x||0,fin:g.st==='fin',tm:g.ad||0})}
  setBoardTitle(res?'Final results':'Live leaderboard');
  ents.sort((a,b)=>(b.fin-a.fin)||(a.fin&&b.fin?(a.tm-b.tm):(b.x-a.x))||(a.id<b.id?-1:1));
  for(const e of ents)e.pc=res?(e.fin?fmt(e.tm):e.racing?'still racing':'DNF'):(e.fin?'Finished':Math.min(99,Math.floor(e.x/L.end*100))+'%');
  renderBoard(ents)}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,flyLeg=-9,flyT=0;
function frame(now){
  fitCanvas(W,H);
  {const eb=document.getElementById('exitg');if(eb)eb.hidden=state.screen==='title'}
  LB.hidden=state.screen!=='lobby'&&state.screen!=='result';RB.hidden=!(state.screen==='lobby'&&room);EB.hidden=state.screen!=='lobby';{const on=state.screen==='play'||state.screen==='count'||state.screen==='result';if(BD.hidden===on)BD.hidden=!on;if(!on&&bdRows.size)clearBoard();else if(on)updateBoard(now)}
  {const lb=document.getElementById('leaveb');if(lb)lb.hidden=state.screen!=='lobby'}DR.hidden=state.screen!=='lobby';APP.classList.toggle('lobby',state.screen==='lobby');
  const dt=Math.min(.05,(now-last)/1000);last=now;const L=state.L;
  if(state.screen==='fly'){
    state.fly+=dt;const fi=flyInfo(L,Math.min(state.fly,FLY_END-.01)),cam=fi.cam;state.cam=cam;state.fi=fi;
    const li=legOf(L,cam+260);if(li!==flyLeg){flyLeg=li;flyT=now;showCap(li>=0?L.legs[li]:INTRO_CAP)}
    const fs=state.fsp,lg=L.legs[li];fs.on=!!(lg&&lg.sponsor);stepSponsorVisual(fs,dt,cam+700);
    if(fs.on){fs.nt-=dt;if(fs.nt<=0){fs.nt=1.5;throwAmend(null,fs.x-20,fs.y+40,cam+300,true);fs.arm=1}}
    stepAmends(dt);
    if(state.fly>=FLY_END){state.screen='count';SKIP.hidden=true;showCap(INTRO_CAP);state.cam=0;amends=[];flyLeg=-9}
  }else if(state.screen==='count'){
    const cd=(state.goAt-performance.now())/1000;state.t=-Math.max(0,cd);const n=Math.ceil(cd);if(n!==state.cdLast&&n>=1&&n<=3){state.cdLast=n;SFX.tick()}
    if(cd<=0){state.screen='play';state.t=0;SFX.go();state.banner='';sendPres(true)}
  }else if(state.screen==='play'){
    acc+=dt;while(acc>=DT){stepWorld();acc-=DT}
    pacc+=dt;if(pacc>.125){pacc=0;sendPres()}
    stepSponsorVisual(state.sp,dt,state.you.x+440);
  }
  if(state.say)state.say.t-=dt;stepFw(dt);stepParts(dt);if(state.toast)state.toast.t-=dt;
  for(const g of ghostMap.values()){g.vx=((g.tx||0)-g.x)*8;g.x+=((g.tx||0)-g.x)*Math.min(1,dt*10);g.y+=((g.ty||0)-g.y)*Math.min(1,dt*10);g.walk+=Math.abs(g.vx)*dt*.06;g.vy=0}
  const raceOn=state.screen==='play'||state.screen==='count'||state.screen==='result';
  state.ghosts=raceOn&&room?[...ghostMap.values()].filter(g=>g.st==='race'||g.st==='fin'):[];
  if(L&&state.you&&state.screen!=='title'&&state.screen!=='lobby'&&state.screen!=='pre'&&state.screen!=='result'){
    if(state.screen==='fly'){
      drawBG(state.cam);drawWorld(L,state.cam,state.fly);drawAmends(state.cam,state.fly);drawSponsor(state.fsp,state.cam,state.fly);drawHUD(L,0,true);if(state.fi&&state.fi.stop!==-2)drawFlyText(L,state.fi.stop,Math.min(1,state.fi.u/.35,(state.fi.pl-state.fi.u)/.3));
    }else{
      const you=state.you,others=state.runners.filter(r=>!r.human).concat(state.ghosts);
      if(you.fin){let p=1;for(const o of others)if(o.fin&&((o.ad||o.ft)<state.adj))p++;state.place=p}
      else{let p=1;for(const o of others)if(o.fin||o.x>you.x)p++;state.place=p}
      state.field=others.length+1;
      const target=clamp(you.x-260,0,L.end+700);state.cam+=(target-state.cam)*Math.min(1,dt*7);
      drawBG(state.cam);drawWorld(L,state.cam,Math.max(0,state.t));
      {const nr=state.runners.filter(r=>!r.human).concat(state.ghosts);nr.sort((p,q)=>Math.abs(p.x-you.x)-Math.abs(q.x-you.x));nr.forEach((g,i)=>{g.nameA=i<3?clamp(1.6-Math.abs(g.x-you.x)/260,0,1):0})}
      for(const r of state.runners)if(!r.human)drawRunner(r,state.t,false);
      {const nr=[...state.ghosts].sort((p,q)=>Math.abs(p.x-you.x)-Math.abs(q.x-you.x));nr.forEach((g,i)=>{g.nameA=i<3?clamp(1.6-Math.abs(g.x-you.x)/260,0,1):0});}
      for(const g of state.ghosts)drawRunner(g,state.t,false);
      drawRunner(you,state.t,true);drawAmends(state.cam,state.t);drawSponsor(state.sp,state.cam,state.t);
      drawParts();drawPops();drawHUD(L,state.t);
      if(state.screen==='count'){const cd=(state.goAt-performance.now())/1000;
        if(cd>3.2){cx.fillStyle='rgba(23,32,58,.6)';cx.fillRect(0,0,W,H);txt('Get ready',W/2,92,40,'#fff','center',[C.ink,9]);drawHowCard()}
        else{const n=Math.ceil(cd),s=n>0?String(n):'GO!';const k=1+(cd%1)*.5;cx.save();cx.translate(W/2,H/2-20);cx.scale(k,k);txt(s,0,0,110,'#fff','center',[C.ink,14]);cx.restore();{const yx=you.x-state.cam+you.w/2,yy=you.y-62,pu=Math.sin(performance.now()/180)*3;rr(yx-52,yy-14+pu,104,26,13);cx.fillStyle=C.gold;cx.fill();txt('You are here',yx,yy+pu,14,C.ink,'center');cx.beginPath();cx.moveTo(yx-7,yy+12+pu);cx.lineTo(yx+7,yy+12+pu);cx.lineTo(yx,yy+21+pu);cx.fill()}}
        }
      if(state.screen==='play'&&state.t>=0&&state.t<.9){const k=1+state.t*.5;cx.save();cx.globalAlpha=1-state.t/.9;cx.translate(W/2,H/2-20);cx.scale(k,k);txt('GO!',0,0,120,C.gold,'center',[C.ink,14]);cx.restore()}
    }
  }else if(state.screen==='lobby'){stepLobby(dt);drawLobby(now/1000)
  }else if(state.screen==='result'){stepLobby(dt);drawResults(now/1000)
  }else if(state.screen==='pre'){
    stepLobby(dt);drawLobby(now/1000);
    const rem=(state.preAt-performance.now())/1000,n=Math.ceil(rem);
    cx.fillStyle='rgba(23,32,58,.6)';cx.fillRect(0,0,W,H);
    txt('Get ready for digital implementation!',W/2,112,36,'#fff','center',[C.ink,9]);
    launch(true)
  }else{
    state.cam+=dt*40;drawBG(state.cam);
    cx.fillStyle=C.teal;cx.fillRect(0,GY,W,H-GY);cx.fillStyle=C.tealL;cx.fillRect(0,GY,W,9)}
  requestAnimationFrame(frame)}

(function boot(){
  const go=()=>{showTitle();requestAnimationFrame(t=>{last=t;frame(t)})};
  whenFontsReady(go);
  (async()=>{const u=await use('user');if(u){try{uid=await u.id()}catch(e){}}
    const d=await use('db');if(d){dbh=d;try{d.collection('results').orderBy('adj','asc').limit(100).onSnapshot(s=>{state.lb=s.docs.map(x=>x.data()).filter(r=>r&&isFinite(+r.adj)).map(r=>({uid:String(r.uid||r.name),name:r.name,team:String(r.team||'solo'),adj:+r.adj}));if(state.screen==='result')renderResult()},()=>{})}catch(e){}}})();
})();
</script>
