  <div id="board" hidden><div class="bd-h">Live leaderboard</div><div id="bdIn"></div></div>

<script>
'use strict';
/* ---------- Stomp the Findings: a single-screen stomp arena for up to 16 players ----------
 One fixed screen with platforms. UAT findings walk the platforms; land on one to squash it.
 In a team room the earliest player in the game (the host) runs the findings, boss, power-ups, waves
 and scores, and sends a snapshot ten times a second. Everyone runs their own avatar and reports
 stomps and pickups to the host, which confirms them. */
const W=800,H=450,GY=340,FY=410,DT=1/120,GRAV=1500,RUN=210,JUMP=640;
const PLATS=[{x0:0,x1:240,y:318},{x0:560,x1:800,y:318},{x0:0,x1:96,y:226},{x0:220,x1:580,y:226},{x0:704,x1:800,y:226},{x0:0,x1:300,y:134},{x0:500,x1:800,y:134}];
const PIPE=58,TOPY=134;
const WAVES=[
  {name:'UAT Round 1',col:'#FFC83D',types:[0],n:p=>6+Math.round(p),crit:p=>0,sp:1,
   head:'Typos are crawling out of the findings pipes.',how:'Land on a finding to squash it. Quick stomps in a row build a combo.',real:'In UAT (user acceptance testing) the study team tests the eCOA system and logs every typo in the patient questionnaires.'},
  {name:'UAT Round 2',col:'#46D6C4',types:[0,1],n:p=>7+Math.round(p*1.2),crit:p=>1+Math.floor(p/4),sp:1.15,
   head:'Broken skip logic joins the typos, and the first critical findings arrive.',how:'Critical findings are big and purple and take two stomps.',real:'Skip logic decides which question a patient sees next. When it breaks, patients see the wrong questions.'},
  {name:'Site Training',col:'#9783FF',types:[0,1,2],n:p=>8+Math.round(p*1.4),crit:p=>2+Math.floor(p/3),sp:1.3,
   head:'"Alarm will not fire" bugs are loose while the sites are trained.',how:'Grab coffee for a speed boost and a compliance coin for a short shield.',real:'Sites are trained on the eCOA devices before go-live. Alarms remind patients to complete their diaries.'},
  {name:'Go-Live',col:'#FF6B9A',types:[0,1,2],n:p=>9+Math.round(p*1.6),crit:p=>3+Math.floor(p/2),sp:1.45,
   head:'Everything is loose and moving fast. Clear it all to unlock go-live.',how:'Stomp other players to steal a point, but watch out for your own head.',real:'Go-live is when the eCOA system is switched on for real patients.'}];
const BOSS_CAP={name:'Protocol Amendment',col:'#FF5436',head:'A protocol amendment has landed just before go-live. Nobody can squash it alone.',how:'Everyone pile on! Every stomp chips it down.',real:'A protocol amendment changes the study plan, so the eCOA system has to be updated to match.'};
const LIVE_CAP={name:'Go live!',col:'#12A594',head:'The amendment is squashed and the eCOA system is live.',how:'Great teamwork.',real:'After go-live, sites can enrol patients and start collecting eCOA data.'};
const INTRO_CAP={name:'Stomp the Findings',col:'#FFC83D',head:'UAT findings are loose on the platforms. Squash them together and take the study live.',how:'Jump on findings to stomp them. Touch one from the side and you are knocked down for a second.',real:'UAT is when the study team tests the eCOA system before patients use it.'};
const TYPOS=['teh','recieve','pateint','diarry','qestion','scroe','paine'];
const BOTS=[['Priya','#FF7AA8'],['Marco','#FFB02E'],['Aiko','#7B61FF'],['Lena','#2EC4B6'],['Sam','#FF6B4A']];
const BOT_W=.6;

/* ---------- state ---------- */
const OV=document.getElementById('ov'),CAP=document.getElementById('cap');
const state={screen:'title',cam:0,toast:null,peers:[],t:0};
const inp={l:false,r:false,j:false,jp:false};
const myPid=Math.random().toString(36).slice(2,10);
let myJoin=0,wasHost=true,room=null,roomCode='',myName='',myCol=PCOL[0],G=null,me=null,bots=[],resBots=[],resRows=[];
const ghostMap=new Map();
const LB=document.getElementById('lobbybar'),RB=document.getElementById('roombar'),EB=document.getElementById('emobar'),APP=document.getElementById('app');
let rosterLast='',lob=null,lpAcc=0,ready=false,lookRand=false;
const ord=n=>['1st','2nd','3rd'][n-1]||n+'th';
function flash(msg,col){state.toast={msg,col,t:2}}
function setOv(html,clear){OV.className=clear?'clear':'';OV.innerHTML=html}
function showCap(c){CAP.hidden=false;CAP.style.borderLeftColor=c.col||'#FFC83D';
  CAP.innerHTML=`<b>${esc(c.name)}</b><span>${esc(c.head)} <strong>${esc(c.how)}</strong></span><em>Real life: ${esc(c.real)}</em>`}

/* ---------- arena physics, shared by avatars and findings ---------- */
const wrapX=(x,w)=>{const c=x+w/2;return c<0?x+W:c>=W?x-W:x};
function land(a){a.onG=false;const f=a.y+a.h,pf=a.py+a.h;
  if(f>=FY){a.y=FY-a.h;a.vy=0;a.onG=true;return}
  if(a.vy<0)return;const c=wrapX(a.x+a.w/2,0);
  for(const p of PLATS)if(c>=p.x0&&c<=p.x1&&pf<=p.y+1&&f>=p.y){a.y=p.y-a.h;a.vy=0;a.onG=true;return}}
const hit=(a,b)=>{let dx=(a.x+a.w/2)-(b.x+b.w/2);if(dx>W/2)dx-=W;else if(dx<-W/2)dx+=W;return Math.abs(dx)<(a.w+b.w)/2&&a.y<b.y+b.h&&a.y+a.h>b.y};
const onHead=(a,b)=>a.vy>0&&a.py+a.h<=b.y+14;

function mkAv(name,col,lk,pid){return{pid,name,col,x:0,y:FY-38,py:FY-38,w:28,h:38,vx:0,vy:0,onG:true,face:1,walk:0,stun:0,inv:0,imm:0,sq:0,shield:0,coffee:0,
  respawn:0,out:false,fin:false,em:0,hat:lk.h|0,gl:lk.g|0,eye:lk.y|0,fit:lk.o|0,pat:lk.p|0,shoe:lk.l|0,combo:0,lastSt:-9,best:0,cds:{}}}
function stepAv(a,ip,dt){
  a.stun=Math.max(0,a.stun-dt);a.inv=Math.max(0,a.inv-dt);a.imm=Math.max(0,a.imm-dt);a.sq=Math.max(0,a.sq-dt);a.shield=Math.max(0,a.shield-dt);a.coffee=Math.max(0,a.coffee-dt);
  for(const k in a.cds){a.cds[k]-=dt;if(a.cds[k]<=0)delete a.cds[k]}
  const ctl=a.stun<=0,dir=ctl?(ip.r?1:0)-(ip.l?1:0):0,sp=RUN*(a.coffee>0?1.35:1),acc=(a.onG?1900:1100)*dt;
  a.vx+=clamp(dir*sp-a.vx,-acc,acc);if(dir)a.face=dir;
  if(ip.jp){ip.jp=false;if(ctl&&a.onG){a.vy=-JUMP*(a.coffee>0?1.08:1);a.onG=false;if(a===me)SFX.jump()}}
  if(!ip.j&&a.vy<-180)a.vy+=GRAV*1.3*dt;
  a.vy=Math.min(a.vy+GRAV*dt,900);a.py=a.y;a.x+=a.vx*dt;a.y+=a.vy*dt;land(a);a.x=wrapX(a.x,a.w);
  a.walk+=Math.abs(a.vx)*dt*.06}
function knock(a,from){if(a.inv>0||a.shield>0||a.stun>0)return false;a.stun=1;a.inv=2.5;a.vy=-260;a.onG=false;
  let dx=(a.x+a.w/2)-(from.x+from.w/2);if(Math.abs(dx)>W/2)dx=-dx;a.vx=(dx>=0?1:-1)*170;return true}

/* ---------- findings ---------- */
function mkEnemy(id,t,crit){const w=crit?44:30,h=crit?38:26;return{id,t,crit:crit?1:0,hp:crit?2:1,w,h,x:0,y:0,py:0,vx:0,vy:0,dir:1,onG:false,hid:0,side:0,daze:0,crk:0,cd:0,gone:0}}
function stepEnemy(e,dt){
  if(e.hid>0){e.hid-=dt;if(e.hid<=0){e.hid=0;const L=e.side===0;e.x=L?PIPE-6:W-PIPE+6-e.w;e.y=TOPY-e.h;e.py=e.y;e.vy=0;e.dir=L?1:-1}return}
  e.cd=Math.max(0,e.cd-dt);
  if(e.daze>0){e.daze-=dt;e.vx=0}else e.vx=e.dir*G.spd*(e.crk?1.5:1)*(e.crit?.85:1);
  e.vy=Math.min(e.vy+GRAV*dt,800);e.py=e.y;e.x+=e.vx*dt;e.y+=e.vy*dt;land(e);
  if(e.onG&&e.y+e.h>=FY&&((e.dir<0&&e.x<PIPE-8)||(e.dir>0&&e.x+e.w>W-PIPE+8))){e.hid=.9;e.side=e.dir<0?1:0}
  else e.x=wrapX(e.x,e.w)}

/* ---------- the Protocol Amendment boss ---------- */
function bossHP(p){return Math.round(12+6*p)}
function stepBoss(B,dt){
  B.fl=Math.max(0,B.fl-dt);B.vy=Math.min(B.vy+GRAV*dt,900);B.py=B.y;B.y+=B.vy*dt;
  if(B.y+B.h>=FY){if(B.vy>250){B.bl++;state.shake=.3}B.y=FY-B.h;B.vy=0;B.onG=true}else B.onG=false;
  if(B.onG){B.vx=B.dir*G.spd*.75*(B.hp<B.max/2?1.4:1);B.hop-=dt;if(B.hop<=0){B.hop=2.4+Math.random()*2;B.vy=-560;B.onG=false}}
  B.x+=B.vx*dt;if(B.x<PIPE+10){B.x=PIPE+10;B.dir=1}if(B.x+B.w>W-PIPE-10){B.x=W-PIPE-10-B.w;B.dir=-1}}

/* ---------- the game state the host runs and sends out ---------- */
function newGame(gid){return{gid,w:0,ph:'ban',pt:6,tot:0,crit:0,sp:0,kc:0,tk:0,spd:58,max:4,nid:1,st:0,E:[],B:null,P:[],pst:8,S:{},K:[],bar:0,bhit:{},imm:{},hitters:{},bl:0,n:1}}
function playerCount(){if(!room)return 1+bots.length*BOT_W;if(state.t<2)return G.np||1;let n=1;for(const g of ghostMap.values())if(g.st==='play'&&g.gid===G.gid)n++;return n}
function amHost(){if(!room)return true;if(!G)return false;for(const g of ghostMap.values())if(g.st==='play'&&g.gid===G.gid&&g.j<myJoin)return false;
  /* until everyone's presence says they are in the game, trust who was earliest in the waiting room */
  return !(state.t<2&&G.hostJ<myJoin)}
function startWave(i){const wv=WAVES[i],p=playerCount();G.w=i;G.n=p;G.tot=wv.n(p);G.crit=Math.min(G.tot,wv.crit(p));G.sp=0;G.kc=0;G.spd=58*wv.sp;G.max=Math.min(14,3+Math.ceil(p*.6));G.ph='ban';G.pt=i?3.5:6;G.st=0}
function spawnEnemy(t,crit){const e=mkEnemy(G.nid++,t,crit);e.hid=.5;e.side=e.id%2;G.E.push(e);return e}
function addScore(pid,n){G.S[pid]=Math.max(0,(G.S[pid]||0)+n)}
function pushK(k){G.K.push(k);fx(k)}
function hostTick(dt){
  G.pt-=dt;const wv=WAVES[G.w];
  if(G.ph==='ban'){if(G.pt<=0)G.ph='wave'}
  else if(G.ph==='wave'){G.st-=dt;
    if(G.st<=0&&G.sp<G.tot&&G.E.length<G.max){G.st=1.5/wv.sp;const left=G.tot-G.sp,crit=Math.random()<G.crit/left;if(crit)G.crit--;spawnEnemy(wv.types[Math.random()*wv.types.length|0],crit);G.sp++}
    if(G.sp>=G.tot&&!G.E.length){if(G.w>=WAVES.length-1){G.ph='bossin';G.pt=3}else startWave(G.w+1)}}
  else if(G.ph==='bossin'){if(G.pt<=0){const p=playerCount(),hp=bossHP(p);G.B={x:W/2-65,y:-160,py:-160,w:130,h:120,vx:0,vy:0,dir:Math.random()<.5?1:-1,hp,max:hp,hop:3,onG:false,fl:0,bl:0};G.ph='boss';G.st=4}}
  else if(G.ph==='boss'){G.st-=dt;if(G.st<=0){G.st=4.5;if(G.E.length<3)spawnEnemy(Math.random()*3|0,false)}}
  for(const e of G.E)stepEnemy(e,dt);
  if(G.B)stepBoss(G.B,dt);
  for(const k in G.bhit){G.bhit[k]-=dt;if(G.bhit[k]<=0)delete G.bhit[k]}
  for(const k in G.imm){G.imm[k]-=dt;if(G.imm[k]<=0)delete G.imm[k]}
  /* power-ups appear on a random platform now and then */
  for(const u of G.P)u.life-=dt;G.P=G.P.filter(u=>u.life>0);
  if(G.ph==='wave'||G.ph==='boss'){G.pst-=dt;if(G.pst<=0){G.pst=10+Math.random()*7;if(G.P.length<2){const pl=Math.random()<.25?{x0:PIPE+20,x1:W-PIPE-20,y:FY}:PLATS[Math.random()*PLATS.length|0];
    G.P.push({id:G.nid++,k:Math.random()<.5?0:1,x:pl.x0+16+Math.random()*(pl.x1-pl.x0-54),y:pl.y-24,life:12})}}}
  const live=G.ph==='live';
  G.bar=live?1:G.ph==='boss'?.8+.2*(G.B?1-G.B.hp/G.B.max:1):G.ph==='bossin'?.8:(G.w+(G.tot?G.kc/G.tot:0))*.2}
/* host: a player reports a stomp, a boss hit, a player stomp or a pickup */
const HOST={
  stomp(d){const e=G.E.find(o=>o.id===(d.id|0));if(!e||e.hid>0||e.cd>0)return;e.cd=.3;e.hp--;
    if(e.hp>0){e.crk=1;e.daze=.6;pushK(['c',e.id,d.pid]);return}
    G.E=G.E.filter(o=>o!==e);if(G.ph==='wave')G.kc++;G.tk++;const pts=(e.crit?3:1)*clamp(d.c|0,1,5);addScore(d.pid,pts);
    pushK(['k',e.id,d.pid,pts,Math.round(e.x+e.w/2),Math.round(e.y+e.h/2),e.crit]);
    if(e.crit&&Math.random()<.45&&G.P.length<3)G.P.push({id:G.nid++,k:Math.random()<.5?0:1,x:clamp(e.x,PIPE,W-PIPE-22),y:e.y+e.h-24,life:10})},
  bhit(d){const B=G.B;if(!B||G.ph!=='boss'||G.bhit[d.pid])return;G.bhit[d.pid]=.3;B.hp--;B.fl=.15;addScore(d.pid,1);G.hitters[d.pid]=1;
    if(B.hp<=0){G.B=null;for(const k in G.hitters)addScore(k,5);G.ph='live';G.pt=5;pushK(['B',Math.round(B.x+B.w/2),Math.round(B.y+B.h/2)])}else pushK(['b',d.pid])},
  pvp(d){const v=String(d.v||'');if(!v||v===d.pid||G.imm[v])return;G.imm[v]=2;const take=Math.min(1,G.S[v]||0);addScore(v,-take);addScore(d.pid,take);pushK(['p',d.pid,v,take])},
  pick(d){const u=G.P.find(o=>o.id===(d.id|0));if(!u)return;G.P=G.P.filter(o=>o!==u);pushK(['u',d.pid,u.k])}};
function claim(type,d){d.pid=me.pid;d.gid=G.gid;if(amHost())HOST[type](d);else if(room){try{room.emit(type,d).catch(()=>{})}catch(e){}}}
/* bots in solo play report to the host directly */
function botClaim(b,type,d){d.pid=b.pid;d.gid=G.gid;HOST[type](d)}

/* ---------- snapshots ---------- */
function encode(){return{gid:G.gid,w:G.w,ph:G.ph,pt:+G.pt.toFixed(2),tot:G.tot,sp:G.sp,kc:G.kc,tk:G.tk,v:Math.round(G.spd),bar:+G.bar.toFixed(3),n:G.n,nid:G.nid,max:G.max,
  E:G.E.map(e=>[e.id,e.t,e.crit,e.hp,Math.round(e.x),Math.round(e.y),Math.round(e.vx),Math.round(e.vy),(e.hid>0?1:0)|(e.daze>0?2:0)|(e.crk?4:0),e.side]),
  B:G.B?[Math.round(G.B.x),Math.round(G.B.y),Math.round(G.B.vx),Math.round(G.B.vy),G.B.hp,G.B.max,G.B.bl,G.B.dir]:0,
  P:G.P.map(u=>[u.id,u.k,Math.round(u.x),Math.round(u.y)]),S:G.S,K:G.K}}
function applySnap(d){const now=performance.now();
  G.w=clamp(d.w|0,0,WAVES.length-1);G.ph=String(d.ph);G.pt=+d.pt||0;G.tot=d.tot|0;G.sp=d.sp|0;G.kc=d.kc|0;G.tk=d.tk|0;G.spd=+d.v||58;G.bar=+d.bar||0;G.n=+d.n||1;G.nid=Math.max(G.nid,d.nid|0);G.max=d.max|0||G.max;G.S=d.S&&typeof d.S==='object'?d.S:{};
  const old=new Map(G.E.map(e=>[e.id,e])),E=[];
  for(const a of d.E||[]){const[id,t,cr,hp,x,y,vx,vy,fl,side]=a;let e=old.get(id);if(!e){e=mkEnemy(id,t|0,cr);e.x=x;e.y=y}
    e.hp=hp;e.vx=vx;e.vy=vy;e.sx=x;e.sy=y;e.svx=vx;e.svy=vy;e.at=now;e.hid=fl&1?1:0;e.daze=fl&2?.2:0;e.crk=fl&4?1:0;e.side=side|0;if(vx)e.dir=vx<0?-1:1;E.push(e)}
  G.E=E;
  if(d.B){const[x,y,vx,vy,hp,max,bl,dir]=d.B;let B=G.B;if(!B){B=G.B={x,y,py:y,w:130,h:120,vx,vy,fl:0,bl,dir,hop:3,onG:false}}if(hp<B.hp)B.fl=.15;B.hp=hp;B.max=max;B.sx=x;B.sy=y;B.vx=vx;B.vy=vy;B.svx=vx;B.svy=vy;B.at=now;B.dir=dir;if(bl!==B.bl){B.bl=bl;state.shake=.3}}else G.B=null;
  G.P=(d.P||[]).map(([id,k,x,y])=>({id,k,x,y}));
  for(const k of d.K||[])fx(k)}
/* non-hosts move findings smoothly toward where the last snapshot says they are now */
function trackSnap(o,dt){if(!o.at)return;const age=Math.min(.3,(performance.now()-o.at)/1000),px=o.sx+o.svx*age,py=Math.min(FY-o.h,o.sy+(o.svy?o.svy*age+.5*GRAV*age*age:0));
  if(Math.abs(px-o.x)>W/2||Math.abs(py-o.y)>80){o.x=px;o.y=py}else{const k=Math.min(1,dt*14);o.x+=(px-o.x)*k;o.y+=(py-o.y)*k}}

/* ---------- effects: everyone plays these when the host confirms something ---------- */
const nameOf=pid=>{if(me&&pid===me.pid)return myName||'You';const b=bots.find(o=>o.pid===pid);if(b)return b.name;for(const g of ghostMap.values())if(g.pid===pid)return g.name;return'Someone'};
const avOf=pid=>me&&pid===me.pid?me:bots.find(o=>o.pid===pid);
function pop(x,y,msg,col){G.pops.push({x,y,msg,col,t:0})}
function fx(k){
  if(k[0]==='k'){const[,id,pid,pts,x,y,crit]=k;burst(x,y,crit?'#9B6BFF':'#FFE08A',crit?22:14,200,80);burst(x,y,'#fff',6,120,40);
    pop(x,y-18,'+'+pts,pid===me.pid?C.gold:'#fff');if(pid===me.pid){beep(620+Math.min(5,me.combo)*110,.09,'triangle',.08);setTimeout(()=>beep(990+Math.min(5,me.combo)*110,.1,'triangle',.07),55)}else beep(500,.05,'triangle',.03)}
  else if(k[0]==='c'){const e=G.E.find(o=>o.id===k[1]);if(e){e.crk=1;burst(e.x+e.w/2,e.y+8,'#C9B4FF',12,160,60)}beep(300,.12,'square',.05,-120)}
  else if(k[0]==='b'){if(G.B){G.B.fl=.15;burst(G.B.x+G.B.w/2,G.B.y+6,'#FF8A73',8,160,60)}beep(140,.12,'square',.07,-40)}
  else if(k[0]==='B'){burst(k[1],k[2],'#fff',40,320,120);burst(k[1],k[2],C.signal,40,260,80);SFX.win();state.shake=.5;fireworks()}
  else if(k[0]==='p'){const[,a,v,take]=k,va=avOf(v);
    if(va){va.sq=.45;va.stun=Math.max(va.stun,.35);va.imm=2;if(va.vy<0)va.vy=0}
    if(v===me.pid){SFX.hit();flash(nameOf(a)+' stomped you!'+(take?' -1 point':''),C.signal)}else if(a===me.pid)flash('You stomped '+nameOf(v)+'!'+(take?' +1 point':''),C.gold);

      a.combo=tnow-a.lastSt<1.5?Math.min(5,a.combo+1):1;a.lastSt=tnow;a.best=Math.max(a.best,a.combo);

      if(isMe){if(a.combo>1)pop(a.x+14,a.y-30,'x'+a.combo+' combo!',C.gold);if(!amHost()){if(e.hp<=1)e.gone=.5;else e.crk=1}}

  copycode(b){copyText(roomCode,b,'Code copied!')}};
for(const el of[LB,RB,EB,DR,OV])el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a]){beep(660,.06,'triangle',.06);ACT[b.dataset.a](b);if(el!==OV&&el!==DR)b.blur()}});
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if((state.screen==='lobby'||state.screen==='result')&&/^Digit[1-3]$/.test(e.code)){if(!e.repeat)ACT.emo({dataset:{v:e.code.slice(5)}});return}
  const k=KM[e.code];if(!k)return;if(state.screen!=='title')e.preventDefault();if(e.repeat)return;
  if(k==='j'){inp.j=true;inp.jp=true}else inp[k]=true});

/* ---------- live leaderboard ---------- */
let bdT=0;
function updateBoard(now){
  if(now-bdT<200||!G||!me)return;bdT=now;const res=state.screen==='result';
  const rows=res?resRows:standings();
  setBoardTitle(res?'Final scores':'Live leaderboard');
  renderBoard(rows.map(r=>({id:bdId(r.lk||r),name:r.me?(myName||'You'):r.name,col:r.lk&&r.lk.col,me:r.me?1:0,fin:false,pc:r.sc+' pt'+(r.sc===1?'':'s')})))}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  fitCanvas(W,H);
  const scr=state.screen;
  {const eb=document.getElementById('exitg');if(eb)eb.hidden=scr==='title'}
  LB.hidden=scr!=='lobby'&&scr!=='result';RB.hidden=!(scr==='lobby'&&room);EB.hidden=scr!=='lobby';
  {const on=scr==='play'||scr==='result';if(BD.hidden===on)BD.hidden=!on;if(!on&&bdRows.size)clearBoard();else if(on)updateBoard(now)}
  {const lb=document.getElementById('leaveb');if(lb)lb.hidden=scr!=='lobby'}DR.hidden=scr!=='lobby';APP.classList.toggle('lobby',scr==='lobby');
  const dt=Math.min(.05,(now-last)/1000),t=now/1000;last=now;
  for(const g of ghostMap.values()){const dx=(g.tx||0)-g.x;if(Math.abs(dx)>W/2)g.x=g.tx||0;g.vx=dx*8;g.x+=((g.tx||0)-g.x)*Math.min(1,dt*12);g.vy=((g.ty||0)-g.y)*8;g.y+=((g.ty||0)-g.y)*Math.min(1,dt*12);g.walk+=Math.abs(g.vx)*dt*.06}
  state.ghosts=scr==='play'&&room&&G?[...ghostMap.values()].filter(g=>g.st==='play'&&g.gid===G.gid):[];
  if(scr==='play'){
    acc+=dt;while(acc>=DT){stepPlay(DT);acc-=DT}
    if(amHost()&&room){snapAcc+=dt;if(snapAcc>=.1){snapAcc=0;try{room.emit('snap',encode()).catch(()=>{})}catch(e){}G.K=[]}}else G.K=[];
    pacc+=dt;if(pacc>.1){pacc=0;sendPres()}
    onPhase();if(state.toast)state.toast.t-=dt;stepFw(dt);stepParts(dt);
    if(state.endAt&&performance.now()>=state.endAt){state.endAt=0;showResult()}
    else{
      state.shake=Math.max(0,(state.shake||0)-dt);cx.save();if(state.shake>0)cx.translate((Math.random()-.5)*10*state.shake,(Math.random()-.5)*10*state.shake);
      drawArena(t);
      for(const u of G.P)if(!me.cds['u'+u.id])drawPower(u,t);
      for(const e of G.E)drawFinding(e,t);
      if(G.B)drawBoss(G.B,t);
      for(const b of bots)drawAv(b,t,false);
      for(const g of state.ghosts)drawAv(g,t,false);
      drawAv(me,t,true);
      drawParts();drawPops(dt);cx.restore();drawHUD(t)}
  }else if(scr==='lobby'){stepLobby(dt);drawLobby(t)}
  else if(scr==='result'){stepLobby(dt);stepParts(dt);drawResults(t)}
  else{drawArena(t)}
  requestAnimationFrame(frame)}

(function boot(){whenFontsReady(()=>{showTitle();requestAnimationFrame(t=>{last=t;frame(t)})})})();
</script>
